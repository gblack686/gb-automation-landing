name: JID5274 Archon Amplify sync

on:
  repository_dispatch:
    types: [jid5274-archon-update]
  workflow_dispatch:
    inputs:
      source_repo:
        description: Archon repository to build
        required: false
        default: gbauto/Archon
        type: string
      ref:
        description: Archon ref to fetch
        required: false
        default: feat/jason-artifacts-tab
        type: string
      sha:
        description: Exact Archon SHA to check out
        required: false
        type: string
      parent_branch:
        description: Landing branch to update
        required: false
        default: master
        type: string

permissions:
  contents: write

concurrency:
  group: jid5274-archon-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SOURCE_REPO: ${{ github.event.client_payload.source_repo || inputs.source_repo || 'gbauto/Archon' }}
      SOURCE_REF: ${{ github.event.client_payload.ref || inputs.ref || 'feat/jason-artifacts-tab' }}
      SOURCE_SHA: ${{ github.event.client_payload.sha || inputs.sha }}
      PARENT_BRANCH: ${{ github.event.client_payload.parent_branch || inputs.parent_branch || 'master' }}
      ARCHON_BASE: /clients/jid5274/archon/
    steps:
      - name: Checkout landing
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PARENT_BRANCH }}
          token: ${{ github.token }}

      - name: Checkout Archon source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_SHA || env.SOURCE_REF }}
          path: _archon
          token: ${{ secrets.GBAUTOMATION_LANDING_PAT || github.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Build Archon web bundle
        working-directory: _archon
        run: |
          bun install --frozen-lockfile
          bun --cwd packages/web run build -- --base="$ARCHON_BASE"

      - name: Copy Archon bundle into landing public assets
        run: |
          rm -rf public/clients/jid5274/archon
          mkdir -p public/clients/jid5274/archon
          cp -R _archon/packages/web/dist/. public/clients/jid5274/archon/

      - name: Build landing smoke
        run: |
          npm ci --cache .npm --prefer-offline
          npm run build

      - name: Commit and push landing update
        run: |
          git add public/clients/jid5274/archon
          if git diff --cached --quiet; then
            echo "No Archon bundle changes to commit."
            exit 0
          fi
          SHORT_SHA="$(git -C _archon rev-parse --short HEAD)"
          git config user.name "jid5274-archon-sync-bot"
          git config user.email "bot@gbautomation.xyz"
          git commit -m "chore(client): sync jid5274 archon to $SHORT_SHA"
          git push origin "HEAD:$PARENT_BRANCH"
