name: Forge Atlas private workspace
on:
  pull_request:
    paths:
      - 'amplify/**'
      - 'src/pages/ForgeAtlas.jsx'
      - 'src/lib/forgeAtlasClient.js'
      - 'src/lib/forgeVisualClient.js'
      - 'src/lib/forgeVisualPacket.js'
      - 'src/lib/forgeBuilder*'
      - 'src/lib/forge-builder/**'
      - 'scripts/validate-forge-builder*'
      - 'src/components/Forge*'
      - 'scripts/validate-forge-visual.mjs'
      - 'src/App.jsx'
      - 'src/components/RequireAuth.jsx'
      - 'src/clients/gbautomation/pages/DashboardPage.jsx'
      - 'scripts/validate-forge-atlas.mjs'
      - 'scripts/validate-forge-atlas-anonymous.mjs'
      - 'scripts/validate-forge-atlas-live.py'
      - 'package*.json'
      - '.github/workflows/forge-atlas.yml'
  push:
    branches: [master]
    paths:
      - 'amplify/**'
      - 'src/pages/ForgeAtlas.jsx'
      - 'src/lib/forgeAtlasClient.js'
      - 'src/lib/forgeVisualClient.js'
      - 'src/lib/forgeVisualPacket.js'
      - 'src/lib/forgeBuilder*'
      - 'src/lib/forge-builder/**'
      - 'scripts/validate-forge-builder*'
      - 'src/components/Forge*'
      - 'scripts/validate-forge-visual.mjs'
      - 'src/App.jsx'
      - 'src/components/RequireAuth.jsx'
      - 'src/clients/gbautomation/pages/DashboardPage.jsx'
      - 'scripts/validate-forge-atlas*.mjs'
      - 'scripts/validate-forge-atlas-live.py'
      - 'package*.json'
      - '.github/workflows/forge-atlas.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forge-atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: node --test amplify/functions/forge-atlas/*.test.mjs
      - run: node --test amplify/functions/forge-visual/*.test.mjs
      - run: node scripts/validate-forge-builder-source.mjs
      - run: node --test amplify/functions/forge-builder/*.test.mjs src/lib/forgeBuilderTransport.test.mjs
      - run: npx tsc --project amplify/tsconfig.json --noEmit --incremental false
      - run: npx eslint src/pages/ForgeAtlas.jsx src/lib/forgeAtlasClient.js src/lib/forgeVisualClient.js src/lib/forgeVisualPacket.js src/components/ForgeVisualStudio.jsx src/components/ForgeModelViewer.jsx
      - run: npx eslint src/components/ForgeExpertBuilder.jsx src/lib/forgeBuilderClient.js src/lib/forgeBuilderTransport.js
      - name: Build the isolated generator image
        run: docker build --platform linux/amd64 -t gbauto-forge-builder:ci amplify/functions/forge-builder/image
      - name: Prove restart, quota and deterministic packet generation
        run: |
          mkdir -p artifacts/forge-atlas-validation/builder-proof
          docker run --rm --user "$(id -u):$(id -g)" --network none --read-only --tmpfs /tmp --mount type=bind,source="$PWD/artifacts/forge-atlas-validation/builder-proof",target=/proof --entrypoint forge-python gbauto-forge-builder:ci apps/forge-builder-host/test/make_fixture.py /proof/bootstrap
          docker run --rm --user "$(id -u):$(id -g)" --network none --read-only --tmpfs /tmp --mount type=bind,source="$PWD/artifacts/forge-atlas-validation/builder-proof/bootstrap",target=/bootstrap,readonly --mount type=bind,source="$PWD/artifacts/forge-atlas-validation/builder-proof",target=/proof --entrypoint node gbauto-forge-builder:ci apps/forge-builder-host/test/integration.mjs /bootstrap /proof
          test -r artifacts/forge-atlas-validation/builder-proof/package/package.zip
      - run: python -m py_compile scripts/validate-forge-atlas-live.py
      - name: Local build configuration
        run: |
          node --input-type=module - <<'JS'
          import {writeFileSync} from 'node:fs';
          writeFileSync('amplify_outputs.json',JSON.stringify({version:'1.4',auth:{aws_region:'us-east-1',user_pool_id:'us-east-1_localfixture',user_pool_client_id:'localfixtureclient',identity_pool_id:'us-east-1:00000000-0000-4000-8000-000000000000',standard_required_attributes:['email'],username_attributes:['email'],user_verification_types:['email'],unauthenticated_identities_enabled:false}}));
          JS
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/validate-forge-visual.mjs
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - run: node scripts/validate-forge-builder-ui.mjs
        env:
          PLAYWRIGHT_CHANNEL: chromium
          FORGE_BUILDER_PROOF: artifacts/forge-atlas-validation/builder-proof
      - name: Test private document host
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5197 --strictPort > /tmp/forge-atlas-vite.log 2>&1 &
          for attempt in $(seq 1 30); do curl --silent --fail http://127.0.0.1:5197/ > /dev/null && break; sleep 1; done
          node scripts/validate-forge-atlas.mjs
      - name: Test production authentication gate
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 5198 --strictPort > /tmp/forge-atlas-preview.log 2>&1 &
          for attempt in $(seq 1 30); do curl --silent --fail http://127.0.0.1:5198/ > /dev/null && break; sleep 1; done
          node scripts/validate-forge-atlas-anonymous.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-atlas-browser
          path: artifacts/forge-atlas-validation/
          if-no-files-found: ignore
