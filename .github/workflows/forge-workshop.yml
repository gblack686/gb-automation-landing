name: Forge Workshop validation
on:
  pull_request:
    paths:
      - 'amplify/**'
      - 'src/pages/AgentWorkshop.jsx'
      - 'src/lib/forgeWorkshopClient.js'
      - 'src/App.jsx'
      - 'public/workshop-ui/**'
      - 'scripts/validate-forge-workshop.mjs'
      - 'package*.json'
      - '.github/workflows/forge-workshop.yml'
permissions:
  contents: read
jobs:
  workshop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: node --test amplify/functions/forge-workshop/contract.test.mjs
      - run: npx tsc --project amplify/tsconfig.json --noEmit --incremental false
      - run: npx eslint src/pages/AgentWorkshop.jsx src/lib/forgeWorkshopClient.js public/workshop-ui/connected.js
      - name: Write local-only build fixture
        run: |
          node --input-type=module - <<'JS'
          import {writeFileSync} from 'node:fs';
          writeFileSync('amplify_outputs.json',JSON.stringify({version:'1.4',auth:{aws_region:'us-east-1',user_pool_id:'us-east-1_localfixture',user_pool_client_id:'localfixtureclient',identity_pool_id:'us-east-1:00000000-0000-4000-8000-000000000000',standard_required_attributes:['email'],username_attributes:['email'],user_verification_types:['email'],unauthenticated_identities_enabled:false}}));
          JS
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Studio browser fixtures
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5196 --strictPort > /tmp/forge-vite.log 2>&1 &
          for attempt in $(seq 1 30); do curl --silent --fail http://127.0.0.1:5196/ > /dev/null && break; sleep 1; done
          node scripts/validate-forge-workshop.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-workshop-browser
          path: artifacts/forge-workshop-validation/
          if-no-files-found: ignore
