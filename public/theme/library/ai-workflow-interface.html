    <script>
        document.addEventListener("DOMContentLoaded", (event) => {
            gsap.registerPlugin();

            // Skill Directive: Masked Word Reveal for the Prompt text
            const promptText = document.getElementById('prompt-reveal');
            if (promptText) {
                const words = promptText.innerText.split(' ');
                promptText.innerHTML = '';
                words.forEach(word => {
                    // Wrap each word in a span with overflow hidden for the mask effect
                    const wordContainer = document.createElement('span');
                    wordContainer.className = 'inline-block overflow-hidden align-top mr-[4px] py-0.5';

                    const wordSpan = document.createElement('span');
                    wordSpan.innerText = word;
                    wordSpan.className = 'inline-block text-gray-300 font-light translate-y-[120%]'; // Initial state pushed down

                    wordContainer.appendChild(wordSpan);
                    promptText.appendChild(wordContainer);
                });

                // Animate words up
                gsap.to('#prompt-reveal span > span', {
                    y: '0%',
                    duration: 0.8,
                    stagger: 0.03,
                    ease: 'power3.out',
                    delay: 0.5
                });
            }

            // Continuous Floating Animation for Nodes (replacing missing CSS keyframes)
            gsap.to('.gsap-node', {
                y: '-=8',
                duration: 4,
                ease: 'sine.inOut',
                yoyo: true,
                repeat: -1,
                stagger: {
                    amount: 2,
                    from: "random"
                }
            });

            // SVG Line Animation (Energy Flow)
            const paths = document.querySelectorAll('#animated-paths path');
            paths.forEach(path => {
                const length = path.getTotalLength();
                path.style.strokeDasharray = `15, ${length / 4}`; // Dashed pattern

                // Animate dash offset to create flowing effect
                gsap.to(path, {
                    strokeDashoffset: -length,
                    duration: 8,
                    ease: "none",
                    repeat: -1
                });
            });

            // Initial Draw-in Animation for Lines
            gsap.from('svg > g:first-child path', {
                strokeDasharray: (i, target) => {
                    const l = target.getTotalLength();
                    return `${l}, ${l}`;
                },
                strokeDashoffset: (i, target) => target.getTotalLength(),
                duration: 1.5,
                ease: "power2.inOut",
                stagger: 0.2
            });

            // Subdued pulse for connection points
            gsap.to('.shadow-\\[0_0_10px_\\#D97757\\]', {
                boxShadow: '0 0 16px #D97757',
                duration: 1.5,
                yoyo: true,
                repeat: -1,
                ease: "sine.inOut",
                stagger: 0.1
            });
        });
    </script>
