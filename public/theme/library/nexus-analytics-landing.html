<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Advanced Data Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>

<link rel="stylesheet" href="gbauto-library-theme.css">
<script defer src="gbauto-library-theme.js"></script>
</head>
<body data-gbauto-surface="landing" class="gbauto-theme bg-[#0a0d14] text-slate-50 font-sans antialiased overflow-x-hidden selection:bg-cyan-900/50 selection:text-white">

    <!-- Background Animation Canvas -->
    <canvas id="bg-canvas" class="fixed inset-0 w-full h-full pointer-events-none z-0"></canvas>

    <!-- UI Overlay -->
    <div class="relative z-10 flex flex-col min-h-screen">

        <!-- Header -->
        <header class="flex items-center justify-between px-6 py-6 md:px-12 lg:px-24 w-full">
            <div class="flex items-center gap-2.5 font-medium text-base tracking-wide">
                <iconify-icon icon="solar:widget-5-linear" class="text-xl text-white"></iconify-icon>
                <span>Nexus</span>
            </div>

            <nav class="hidden md:flex items-center gap-8 text-sm font-normal text-slate-400">
                <a href="#" class="hover:text-white transition-colors duration-200">Platform</a>
                <a href="#" class="hover:text-white transition-colors duration-200">Insights</a>
                <a href="#" class="hover:text-white transition-colors duration-200">Plans</a>
                <a href="#" class="hover:text-white transition-colors duration-200">Ecosystem</a>
            </nav>

            <button class="hidden md:inline-flex items-center justify-center px-5 py-2.5 text-sm font-medium text-white transition-all duration-200 bg-white/5 border border-white/10 rounded-md hover:bg-white/10 hover:border-white/20 backdrop-blur-md">
                Start building
            </button>

            <!-- Mobile Menu Icon -->
            <button class="md:hidden text-slate-400 hover:text-white">
                <iconify-icon icon="solar:hamburger-menu-linear" class="text-2xl"></iconify-icon>
            </button>
        </header>

        <!-- Hero Section -->
        <main class="flex-1 flex flex-col justify-center px-6 md:px-12 lg:px-24 w-full max-w-7xl mx-auto pb-20 mt-12 md:mt-0">
            <div class="max-w-3xl">
                <h1 class="font-serif text-5xl md:text-7xl lg:text-[80px] leading-[1.05] tracking-tighter text-white font-normal mb-6">
                    Uncover hidden patterns before the market does
                </h1>

                <p class="text-lg md:text-xl text-slate-300/80 mb-10 max-w-2xl leading-relaxed font-light">
                    Analyze trends, monitor metrics, and convert massive datasets into strategic advantages instantly with our next-generation intelligence engine.
                </p>

                <button class="inline-flex items-center justify-center px-6 py-3.5 text-sm font-medium text-white transition-all duration-200 bg-[#242938]/60 border border-white/10 rounded-md hover:bg-[#343b4d]/80 hover:border-white/20 backdrop-blur-md ring-1 ring-transparent hover:ring-white/5 shadow-xl shadow-black/50">
                    Start building
                </button>
            </div>
        </main>
    </div>

    <!-- Canvas Animation Script -->
    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        let width, height;
        let time = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const gridSize = 24;
        const cornerRadius = 5;

        function drawRoundedRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.lineTo(x + w, y + h - r);
            ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
            ctx.lineTo(x + r, y + h);
            ctx.arcTo(x, y + h, x, y + h - r, r);
            ctx.lineTo(x, y + r);
            ctx.arcTo(x, y, x + r, y, r);
            ctx.closePath();
        }

        function render() {
            // Clear background with dark slate color
            ctx.fillStyle = '#F3F1E7';
            ctx.fillRect(0, 0, width, height);

            time += 0.015;

            // Optimize loop by only drawing visible blocks
            for (let x = 0; x < width; x += gridSize) {
                for (let y = 0; y < height; y += gridSize) {

                    // Normalized coordinates (0 to 1)
                    let nx = x / width;
                    let ny = y / height;

                    // Create diagonal waves for light beams
                    // The magic numbers dictate the angle and frequency of the beams
                    let wave1 = Math.sin((nx * 1.5 + ny * 2.5) * 4 - time * 2);
                    let wave2 = Math.sin((nx * 2.0 - ny * 1.0) * 3 + time * 1.5);

                    // Base intensities
                    let cyanIntensity = Math.max(0, wave1) * 1.8;
                    let redIntensity = Math.max(0, wave2) * 1.5;

                    // Spatial masking - concentrate light on the middle-right area
                    // mimicking the reference image's lighting distribution
                    let maskX = Math.pow(nx, 1.2);
                    let maskY = 1 - Math.abs(ny - 0.5) * 1.5;
                    let globalMask = Math.max(0, maskX * maskY);

                    // Apply mask
                    cyanIntensity *= globalMask;
                    redIntensity *= globalMask;

                    // Add high-frequency noise to simulate independent pixel variations
                    let noise = Math.sin(x * 12.9898 + y * 78.233 + time * 2) * 43758.5453;
                    noise = noise - Math.floor(noise);

                    // Apply noise to break up solid beams into blocks
                    cyanIntensity *= (0.4 + noise * 0.6);
                    redIntensity *= (0.4 + noise * 0.6);

                    // Calculate final colors based on overlapping intensities
                    let r = Math.min(255, redIntensity * 255 + cyanIntensity * 20);
                    let g = Math.min(255, cyanIntensity * 190 + redIntensity * 40);
                    let b = Math.min(255, cyanIntensity * 255 + redIntensity * 60);

                    // Calculate alpha, cull blocks that are too dim to save performance
                    let alpha = (cyanIntensity + redIntensity) * 0.7;

                    if (alpha > 0.03) {
                        ctx.fillStyle = `rgba(217, 119, 87, ${Math.min(0.32, alpha * 0.28)})`;
                        // Draw block slightly smaller than gridSize to create gaps
                        drawRoundedRect(x + 2, y + 2, gridSize - 4, gridSize - 4, cornerRadius);
                        ctx.fill();
                    }
                }
            }
            requestAnimationFrame(render);
        }

        // Start animation loop
        render();
    </script>
</body>
</html>
