<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img">
<title>Eval Uncertainty Fan</title>
<desc>Prediction bands fan out to show confidence, variance, and missing eval coverage.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F3F1E7"/><stop offset="100%" stop-color="#E6E4D9"/></linearGradient>
<radialGradient id="glow" cx="76%" cy="14%" r="70%"><stop offset="0%" stop-color="#3D6EA8" stop-opacity=".16"/><stop offset="100%" stop-color="#3D6EA8" stop-opacity="0"/></radialGradient>
<pattern id="grain" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="rgba(25,25,25,.10)"/></pattern>
</defs>
<rect width="1600" height="1200" fill="url(#bg)"/>
<rect width="1600" height="1200" fill="url(#glow)"/>
<rect x="52" y="52" width="1496" height="1096" rx="24" fill="none" stroke="#D6D4C8" stroke-width="1.4"/>
<rect x="92" y="260" width="1416" height="780" rx="22" fill="url(#grain)" opacity=".44"/>
<text x="96.0" y="116.0" font-size="18" font-weight="800" fill="#3D6EA8" text-anchor="start">09 / ADVANCED FORM / FAN</text>
<text x="96.0" y="178.0" font-size="56" font-weight="500" fill="#191919" text-anchor="start">Eval Uncertainty Fan</text>
<text x="98.0" y="225.0" font-size="22" font-weight="400" fill="rgba(25,25,25,.62)" text-anchor="start">Prediction bands fan out to show confidence, variance, and missing eval coverage.</text>
