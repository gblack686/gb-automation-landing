<path d="M230 820 C560 415 990 495 1380 425 L1380 938 C980 858 570 968 230 820 Z" fill="#3D6EA8" opacity=".18" stroke="#3D6EA8" stroke-width="2"/>
<path d="M230 820 C560 470 990 550 1380 480 L1380 896 C980 816 570 926 230 820 Z" fill="#C08A3E" opacity=".18" stroke="#C08A3E" stroke-width="2"/>
<path d="M230 820 C560 525 990 605 1380 535 L1380 854 C980 774 570 884 230 820 Z" fill="#B94A48" opacity=".18" stroke="#B94A48" stroke-width="2"/>
