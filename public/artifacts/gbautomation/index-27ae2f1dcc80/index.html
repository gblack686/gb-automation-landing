 f15fee25\\r\\n\\r\\n**Status:** `ok` · **Duration:** 0.003s · **Steps:** 7 (4 ok / 3 mocked / 0 error)\\r\\n\\r\\nStarted: `2026-05-01T18:42:06+00:00` · Ended: `2026-05-01T18:42:06+00:00`\\r\\n\\r\\n## Steps\\r\\n\\r\\n| # | Step | Mode | Status | Duration |\\r\\n|---|------|------|--------|----------|\\r\\n| 1 | Read + validate task frontmatter | ✓ REAL | ✓ ok | 0.001s |\\r\\n| 2 | Flip frontmatter: inbox_", "scoreComponents": {"freshness": 100, "typeFit": 92, "nameSignal": 52, "substance": 88}, "baseScore": 83}, {"id": "artifacts/plan-renders/2026-04-28-vault-audit-skill/index.html", "path": "artifacts/plan-renders/2026-04-28-vault-audit-skill/index.html", "href": "../plan-renders/2026-04-28-vault-audit-skill/index.html", "basename": "index.html", "extension": ".html", "kind": "html", "category": "plan", "mime": "text/html", "sizeBytes": 17890, "modifiedAt": "2026-05-19T21:44:25+00:00", "previewText": "&lt;!DOCTYPE html&gt;\r\n&lt;html&gt;\r\n&lt;head&gt;\r\n&lt;meta charset=\"utf-8\"&gt;\r\n&lt;title&gt;2026 04 28 Vault Audit Skill&lt;/title&gt;\r\n&lt;style&gt;\r\nbody{font-family:sans-serif;max-width:860px;margin:40px auto;padding:0 20px;line-height:1.6;color:#1a1a1a}\r\nh1,h2,h3{color:#111}\r\npre{background:#f4f4f4;padding:16px;overflow-x:auto;border-radius:4px}\r\ncode{background:#f4f4f4;padding:2px 4px;border-radius:3px;font-size:0.92em}\r\ntable{border-collapse:collapse;width:100%}\r\nth,td{border:1px solid #ddd;padding:8px;text-align:left}\r\nth{background:#f0f0f0}\r\nblockquote{border-left:4px solid #ccc;margin:0;padding-left:16px;color:#555}\r\na{color:#0066cc}\r\n&lt;/style&gt;\r\n&lt;/head&gt;\r\n&lt;body&gt;\r\n&lt;hr /&gt;\r\n&lt;p&gt;date: 2026-04-28\r\ntags: [plan, skill, obsidian, vault-audit, graph-hygiene]\r\nstatus: proposed\r\ntype: plan\r\ndescription: Plan for a /vault-audit skill that classifies orphans (six-label taxonomy), detects missing _&lt;folder&gt;.md MOCs, flags convention violations, and suggests QMD-backed links — read-only report, mutations live in separate scripts. Supersedes the too-lenient v1 classifier from outputs/orphan-audit.md.\r\nrelated:\r\n  - \"[[2026-04-28-graph-hygiene-tactics]]\"\r\n  - \"[[2026-04-28-no-index-md-convention]]\"\r\n  - \"[[2026-04-28-obsidian-mind-vendor]]\"\r\n  - \"[[obsidian]]\"&lt;/p&gt;\r\n&lt;hr /&gt;\r\n&lt;h1&gt;Plan — &lt;code&gt;vault-audit&lt;/code&gt; skill (graph hygiene + orphan curation)&lt;/h1&gt;\r\n&lt;h2&gt;Why this exists&lt;/h2&gt;\r\n&lt;p&gt;[[2026-04-28-graph-hygiene-tactics]] adopted six tactics for keeping the graph readable and explicitly listed &lt;code&gt;/vault-audit&lt;/code&gt; as a planned-but-not-built sixth. A first-pass classifier produced &lt;code&gt;outputs/orphan-audit.md&lt;/code&gt; with 201 candidates, but the rules were too lenient — the report wasn't actionable. We also now have two new pieces of intelligence the v1 classifier didn't have:&lt;/p&gt;\r\n&lt;ol&gt;\r\n&lt;li&gt;&lt;strong&gt;QMD is indexed&lt;/strong&gt; ([[2026-04-28-obsidian-mind-vendor]]) — we can ask \"what are the top-3 semantic neighbors of this orphan?\" and emit them as &lt;code&gt;[[suggested-link]]&lt;/code&gt; candidates in the report.&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;MOC convention is locked&lt;/strong&gt; ([[2026-04-28-no-index-md-convention]]) — every topical folder either has &lt;code&gt;_&amp;lt;folder&amp;gt;.md&lt;/code&gt; or shouldn't have a folder at all. The audit can detect both regressions.&lt;/li&gt;\r\n&lt;/ol&gt;\r\n&lt;p&gt;&lt;code&gt;validate-write.ts&lt;/code&gt; (PostToolUse) covers per-file hygiene at write time. &lt;code&gt;vault-audit&lt;/code&gt; is the periodic vault-wide sweep — different scope, different cadence. The two are complements, not duplicates.&lt;/p&gt;\r\n&lt;h2&gt;Scope&lt;/h2&gt;\r\n&lt;p&gt;A skill (invokable as &lt;code&gt;/vault-audit&lt;/code&gt;) that runs four sub-audits and emits a single remediation report. Read-only by default — never mutates the vault. Mutations happen via separate, explicit follow-up scripts (already proven pattern: &lt;code&gt;outputs/index_cleanup.py&lt;/code&gt;).&lt;/p&gt;\r\n&lt;table&gt;\r\n&lt;thead&gt;\r\n&lt;tr&gt;\r\n&lt;th&gt;Sub-audit&lt;/th&gt;\r\n&lt;th&gt;Question it answers&lt;/th&gt;\r\n&lt;th&gt;Output&lt;/th&gt;\r\n&lt;/tr&gt;\r\n&lt;/thead&gt;\r\n&lt;tbody&gt;\r\n&lt;tr&gt;\r\n&lt;td&gt;&lt;code&gt;orphans&lt;/code&gt;&lt;/td&gt;\r\n&lt;td&gt;Which notes have zero inbound + zero outbound &lt;code&gt;[[…]]&lt;/code&gt;? Why?&lt;/td&gt;\r\n&lt;td&gt;Classified table — stub / archive / missing-link / artifact / unclassified&lt;/td&gt;\r\n&lt;/tr&gt;\r\n&lt;tr&gt;\r\n&lt;td&gt;&lt;code&gt;mocs&lt;/code&gt;&lt;/td&gt;\r\n&lt;td&gt;Which non-trivial folders lack &lt;code&gt;_&amp;lt;folder&amp;gt;.md&lt;/code&gt;? Which have &lt;code&gt;_index.md&lt;/code&gt; regressions?&lt;/td&gt;\r\n&lt;td&gt;Folder list with recommendation (create MOC / promote to flat / delete)&lt;/td&gt;\r\n&lt;/tr&gt;\r\n&lt;tr&gt;\r\n&lt;td&gt;&lt;code&gt;conventions&lt;/code&gt;&lt;/td&gt;\r\n&lt;td&gt;Which notes violate frontmatter / tag / wikilink rules vault-wide?&lt;/td&gt;\r\n&lt;td&gt;Per-rule violation count + sample paths&lt;/td&gt;\r\n&lt;/tr&gt;\r\n&lt;tr&gt;\r\n&lt;td&gt;&lt;code&gt;excludes&lt;/code&gt;&lt;/td&gt;\r\n&lt;td&gt;Which paths are in the graph but should be excluded? Which are excluded but shouldn't be?&lt;/td&gt;\r\n&lt;td&gt;Diff against &lt;code&gt;[[2026-04-28-graph-hygiene-tactics]]&lt;/code&gt; exclude list&lt;/td&gt;\r\n&lt;/tr&gt;\r\n&lt;/tbody&gt;\r\n&lt;/table&gt;\r\n&lt;p&gt;Sub-audits run independently; &lt;code&gt;full&lt;/code&gt; runs all four.&lt;/p&gt;\r\n&lt;h2&gt;TAC-first reuse audit&lt;/h2&gt;\r\n&lt;p&gt;Per non-negotiable reuse policy. What exists, what we extend, what's genuinely new:&lt;/p&gt;\r\n&lt;table&gt;\r\n&lt;thead&gt;\r\n&lt;tr&gt;\r\n&lt;th&gt;Existing artifact&lt;/th&gt;\r\n&lt;th&gt;Reuse decision&lt;/th&gt;\r\n&lt;/tr&gt;\r\n&lt;/thead&gt;\r\n&lt;tbody&gt;\r\n&lt;tr&gt;\r\n&lt;td&gt;&lt;code&gt;outputs/orphan-audit.md&lt;/code&gt; (first-pass report)&lt;/td&gt;\r\n&lt;td&gt;Read on first run as baseline; classifier rewrite supersedes it&lt;/td&gt;\r\n&lt;/tr&gt;\r\n&lt;tr&gt;\r\n&lt;td&gt;&lt;code&gt;outputs/index_cleanup.py&lt;/code&gt;&lt;/td&gt;\r\n&lt;td&gt;Pattern reference for re-runnable migrations; orphan-fix script will mirror its shape&lt;/td&gt;\r\n&lt;/tr&gt;\r\n&lt;tr&gt;\r\n&lt;td&gt;&lt;code&gt;validate-write.ts&lt;/code&gt; (PostToolUse hook)&lt;/td&gt;\r\n&lt;td&gt;Skill imports its frontmatter validator + wikilink detector — single source of truth for per-file hygiene rules&lt;/td&gt;\r\n&lt;/tr&gt;\r\n&lt;tr&gt;\r\n&lt;td&gt;&lt;code&gt;classify-message.ts&lt;/code&gt; matcher pattern&lt;/td&gt;\r\n&lt;td&gt;Reuse &lt;code&gt;compileMatcher&lt;/code&gt; + Latin-boundary lookarounds for \"stub\" / \"archive\" / \"auto-gen\" detection in note bodies&lt;/td&gt;\r\n&lt;/tr&gt;\r\n&lt;tr&gt;\r\n&lt;td&gt;&lt;code&gt;qmd-mcp.mjs&lt;/code&gt; / &lt;code&gt;npx qmd query&lt;/code&gt;&lt;/td&gt;\r\n&lt;td&gt;Source of &lt;code&gt;[[suggested-link]]&lt;/code&gt; candidates per orphan&lt;/td&gt;\r\n&lt;/tr&gt;\r\n&lt;tr&gt;\r\n&lt;td&gt;&lt;code&gt;update-wiki/scripts/detectors/rule1_missing_entity.py&lt;/code&gt;, &lt;code&gt;rule2_concept_hub.py&lt;/code&gt;&lt;/td&gt;\r\n&lt;td&gt;Pattern reference for classifier rules — they already encode \"is this an auto-gen stub?\" detection&lt;/td&gt;\r\n&lt;/tr&gt;\r\n&lt;tr&gt;\r\n&lt;td&gt;&lt;code&gt;enforce-linear-frontmatter.py&lt;/code&gt;&lt;/td&gt;\r\n&lt;td&gt;Different scope (Linear gating). No reuse, no conflict — &lt;code&gt;vault-audit&lt;/code&gt; does not touch &lt;code&gt;tasks/*.md&lt;/code&gt; Linear validation.&lt;/td&gt;\r\n&lt;/tr&gt;\r\n&lt;tr&gt;\r\n&lt;td&gt;&lt;code&gt;graphify-sync&lt;/code&gt; skill&lt;/td&gt;\r\n&lt;td&gt;Different scope (external &lt;code&gt;graphify&lt;/code&gt; tool for client repo code graphs). No overlap with Obsidian vault graph.&lt;/td&gt;\r\n&lt;/tr&gt;\r\n&lt;/tbody&gt;\r\n&lt;/table&gt;\r\n&lt;p&gt;&lt;strong&gt;No TAC-no-match note required&lt;/strong&gt; — every component has a reuse target. The skill is glue + classifier rules, not new infrastructure.&lt;/p&gt;\r\n&lt;h2&gt;Architecture&lt;/h2&gt;\r\n&lt;p&gt;Skill lives at the &lt;strong&gt;gbautomation root&lt;/strong&gt; — we work from &lt;code&gt;gbautomation/&lt;/code&gt;, not from inside &lt;code&gt;second-brain/&lt;/code&gt;, so the skill belongs alongside other root-level tooling. Vault path is configured, not implicit.&lt;/p&gt;\r\n&lt;pre&gt;&lt;code&gt;gbautomation/.claude/skills/vault-audit/\r\n├── SKILL.md                    # Skill manifest (frontmatter + invocation guide)\r\n├── audit.ts                    # Main entry; subcommand dispatcher\r\n├── classifiers/\r\n│   ├── orphan.ts               # Orphan taxonomy + per-note classification\r\n│   ├── moc.ts                  # _&amp;lt;folder&amp;gt;.md presence + _index.md regression check\r\n│   ├── convention.ts           # Reuses validate-write.ts rules vault-wide\r\n│   └── excludes.ts             # Diffs .obsidian/app.json against ADR exclude list\r\n├── lib/\r\n│   ├── qmd-suggest.ts          # Top-N semantic neighbors via qmd CLI\r\n│   ├── vault-root.ts           # Resolve VAULT_ROOT (env override → default `second-brain/`)\r\n│   └── report.ts               # Markdown report writer\r\n└── tests/\r\n    └── classifier.test.ts      # Locks classifier rules — re-runnable on every PR\r\n&lt;/code&gt;&lt;/pre&gt;\r\n&lt;ul&gt;\r\n&lt;li&gt;&lt;strong&gt;Vault root resolution.&lt;/strong&gt; &lt;code&gt;lib/vault-root.ts&lt;/code&gt; returns &lt;code&gt;process.env.VAULT_ROOT&lt;/code&gt; if set, else &lt;code&gt;&amp;lt;gbautomation-root&amp;gt;/second-brain&lt;/code&gt;. Required because the skill is one level above the vault and can't use &lt;code&gt;import.meta.url&lt;/code&gt;-relative paths the way &lt;code&gt;second-brain/.claude/scripts/&lt;/code&gt; does.&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;Reusing obsidian-mind validators.&lt;/strong&gt; &lt;code&gt;classifiers/convention.ts&lt;/code&gt; imports from &lt;code&gt;second-brain/.claude/scripts/lib/&lt;/code&gt; via relative path (&lt;code&gt;../../../second-brain/.claude/scripts/lib/...&lt;/code&gt;). When a second client vault adopts this skill, the import path becomes the configurable bit — but for now, gbautomation's vault is the only consumer.&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;Report output.&lt;/strong&gt; &lt;code&gt;outputs/vault-audit/&amp;lt;YYYY-MM-DD&amp;gt;-report.md&lt;/code&gt; at the gbautomation root (matches how &lt;code&gt;outputs/orphan-audit.md&lt;/code&gt; already lives).&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;Runtime.&lt;/strong&gt; bun (matches &lt;code&gt;second-brain/.claude/scripts/&lt;/code&gt;, sidesteps the OneDrive + Node 23 libuv issue).&lt;/li&gt;\r\n&lt;/ul&gt;\r\n&lt;h2&gt;Orphan taxonomy (the v1 was \"too lenient\")&lt;/h2&gt;\r\n&lt;p&gt;A note is an orphan if it has &lt;strong&gt;zero inbound wikilinks AND zero outbound wikilinks&lt;/strong&gt;. The classifier then assigns one of these labels:&lt;/p&gt;\r\n&lt;table&gt;\r\n&lt;thead&gt;\r\n&lt;tr&gt;\r\n&lt;th&gt;Label&lt;/th&gt;\r\n&lt;th&gt;Detection rule&lt;/th&gt;\r\n&lt;th&gt;Recommended action&lt;/th&gt;\r\n&lt;/tr&gt;\r\n&lt;/thead&gt;\r\n&lt;tbody&gt;\r\n&lt;tr&gt;\r\n&lt;td&gt;&lt;code&gt;auto-gen-stub&lt;/code&gt;&lt;/td&gt;\r\n&lt;td&gt;Body contains &lt;code&gt;_TBD_&lt;/code&gt; / &lt;code&gt;Auto-generated&lt;/code&gt; / &lt;code&gt;## Files Referencing&lt;/code&gt; markers AND no human edit since last &lt;code&gt;update-wiki&lt;/code&gt; run&lt;/td&gt;\r\n&lt;td&gt;Delete on next &lt;code&gt;update-wiki&lt;/code&gt; regen; ignore in report unless count balloons&lt;/td&gt;\r\n&lt;/tr&gt;\r\n&lt;tr&gt;\r\n&lt;td&gt;&lt;code&gt;archive&lt;/code&gt;&lt;/td&gt;\r\n&lt;td&gt;Path matches one of the exclude folders from [[2026-04-28-graph-hygiene-tactics]] (&lt;code&gt;_archive/&lt;/code&gt;, &lt;code&gt;drafts/sent/&lt;/code&gt;, &lt;code&gt;intelligence/correspondence/…&lt;/code&gt;)&lt;/td&gt;\r\n&lt;td&gt;Already excluded from graph; ignore&lt;/td&gt;\r\n&lt;/tr&gt;\r\n&lt;tr&gt;\r\n&lt;td&gt;&lt;code&gt;missing-link&lt;/code&gt;&lt;/td&gt;\r\n&lt;td&gt;Has frontmatter, has body, was edited by a human (commit author ≠ generator), but lacks any &lt;code&gt;[[…]]&lt;/code&gt;&lt;/td&gt;\r\n&lt;td&gt;&lt;strong&gt;Actionable.&lt;/strong&gt; Emit with top-3 QMD neighbors as suggested links&lt;/td&gt;\r\n&lt;/tr&gt;\r\n&lt;tr&gt;\r\n&lt;td&gt;&lt;code&gt;dead-end-leaf&lt;/code&gt;&lt;/td&gt;\r\n&lt;td&gt;Has body content, but is the deepest leaf in a chain that nothing links to&lt;/td&gt;\r\n&lt;td&gt;Suggest backlinking from &lt;code&gt;_&amp;lt;folder&amp;gt;.md&lt;/code&gt; MOC&lt;/td&gt;\r\n&lt;/tr&gt;\r\n&lt;tr&gt;\r\n&lt;td&gt;&lt;code&gt;artifact&lt;/code&gt;&lt;/td&gt;\r\n&lt;td&gt;Filename matches &lt;code&gt;*-backup-*&lt;/code&gt;, &lt;code&gt;*.brain-backup-*&lt;/code&gt;, &lt;code&gt;**/2026-*-lint-report.md&lt;/code&gt;&lt;/td&gt;\r\n&lt;td&gt;Recommend File Ignore plugin pattern; not a real orphan&lt;/td&gt;\r\n&lt;/tr&gt;\r\n&lt;tr&gt;\r\n&lt;td&gt;&lt;code&gt;unclassified&lt;/code&gt;&lt;/td&gt;\r\n&lt;td&gt;None of the above&lt;/td&gt;\r\n&lt;td&gt;Surface for human review — these are the ambiguous ones&lt;/td&gt;\r\n&lt;/tr&gt;\r\n&lt;/tbody&gt;\r\n&lt;/table&gt;\r\n&lt;p&gt;The lenience bug in v1 was treating &lt;code&gt;auto-gen-stub&lt;/code&gt; and &lt;code&gt;missing-link&lt;/code&gt; the same. The new rules separate them so the report only highlights what a human can act on.&lt;/p&gt;\r\n&lt;h2&gt;Phased plan&lt;/h2&gt;\r\n&lt;h3&gt;Phase 0 — TAC-first intake + spec lock&lt;/h3&gt;\r\n&lt;ol&gt;\r\n&lt;li&gt;Re-read [[2026-04-28-graph-hygiene-tactics]], [[2026-04-28-no-index-md-convention]], &lt;code&gt;validate-write.ts&lt;/code&gt;, &lt;code&gt;classify-message.ts&lt;/code&gt;, &lt;code&gt;qmd-mcp.mjs&lt;/code&gt;. Confirm the reuse audit table above survives contact with the actual code.&lt;/li&gt;\r\n&lt;li&gt;Run a single QMD query end-to-end (&lt;code&gt;npx qmd query \"fish-group billing\"&lt;/code&gt;) to confirm latency budget — if P95 &amp;gt; 500ms per query, &lt;code&gt;qmd-suggest.ts&lt;/code&gt; becomes batched (one query per 10 orphans, not one per orphan).&lt;/li&gt;\r\n&lt;li&gt;Lock the orphan taxonomy. Anything ambiguous after the spec lock either gets a &lt;code&gt;unclassified&lt;/code&gt; bucket or a TAC-no-match note before code ships.&lt;/li&gt;\r\n&lt;/ol&gt;\r\n&lt;h3&gt;Phase 1 — Classifier core (read-only, no QMD yet)&lt;/h3&gt;\r\n&lt;ol&gt;\r\n&lt;li&gt;&lt;code&gt;audit.ts&lt;/code&gt; skeleton with subcommand dispatcher (&lt;code&gt;orphans&lt;/code&gt;, &lt;code&gt;mocs&lt;/code&gt;, &lt;code&gt;conventions&lt;/code&gt;, &lt;code&gt;excludes&lt;/code&gt;, &lt;code&gt;full&lt;/code&gt;).&lt;/li&gt;\r\n&lt;li&gt;&lt;code&gt;classifiers/orphan.ts&lt;/code&gt; — implements the six-label taxonomy above. Walks the vault, parses frontmatter (reuses &lt;code&gt;validate-write.ts&lt;/code&gt; parser), counts inbound/outbound &lt;code&gt;[[…]]&lt;/code&gt;.&lt;/li&gt;\r\n&lt;li&gt;&lt;code&gt;classifiers/moc.ts&lt;/code&gt; — for every directory under &lt;code&gt;second-brain/&lt;/code&gt;, checks for &lt;code&gt;_&amp;lt;dirname&amp;gt;.md&lt;/code&gt;; flags any &lt;code&gt;_index.md&lt;/code&gt; (defensive — they're all gone, but generator regressions are real).&lt;/li&gt;\r\n&lt;li&gt;&lt;code&gt;lib/report.ts&lt;/code&gt; — emits &lt;code&gt;outputs/vault-audit/&amp;lt;YYYY-MM-DD&amp;gt;-report.md&lt;/code&gt; with one section per sub-audit. Frontmatter includes audit hash so two consecutive runs over the same vault produce identical reports (testable).&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;Verification:&lt;/strong&gt; report on current vault matches the manually-curated subset of &lt;code&gt;outputs/orphan-audit.md&lt;/code&gt; for the obvious cases (every &lt;code&gt;auto-gen-stub&lt;/code&gt; and &lt;code&gt;archive&lt;/code&gt; is correctly labeled).&lt;/li&gt;\r\n&lt;/ol&gt;\r\n&lt;h3&gt;Phase 2 — QMD link suggestions&lt;/h3&gt;\r\n&lt;ol&gt;\r\n&lt;li&gt;&lt;code&gt;lib/qmd-suggest.ts&lt;/code&gt; — invokes &lt;code&gt;qmd query \"&amp;lt;note basename + first-paragraph keywords&amp;gt;\"&lt;/code&gt; per &lt;code&gt;missing-link&lt;/code&gt; orphan. Returns top-3 neighbors above a similarity threshold (start at 0.55, tune).&lt;/li&gt;\r\n&lt;li&gt;Threshold below 0.55 → emit suggestion as \"weak — review before linking\" (we want false positives over false negatives in suggestions; the human curates).&lt;/li&gt;\r\n&lt;li&gt;Cache results keyed by file path + mtime so re-running the audit doesn't re-query QMD for unchanged files.&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;Verification:&lt;/strong&gt; for 10 known-good orphans (notes a human can identify the correct link for), QMD top-3 must contain the correct link in ≥ 7 cases. If miss rate &amp;gt; 30%, threshold or query construction needs adjustment before shipping.&lt;/li&gt;\r\n&lt;/ol&gt;\r\n&lt;h3&gt;Phase 3 — Convention + excludes audits&lt;/h3&gt;\r\n&lt;ol&gt;\r\n&lt;li&gt;&lt;code&gt;classifiers/convention.ts&lt;/code&gt; — runs &lt;code&gt;validate-write.ts&lt;/code&gt;'s rule set across every &lt;code&gt;.md&lt;/code&gt; in the vault (not just one file). Aggregates counts per rule, lists top-N offenders.&lt;/li&gt;\r\n&lt;li&gt;&lt;code&gt;classifiers/excludes.ts&lt;/code&gt; — reads &lt;code&gt;.obsidian/app.json&lt;/code&gt; &lt;code&gt;userIgnoreFilters&lt;/code&gt;, diffs against the ADR's exclude list. Reports adds + drops.&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;Verification:&lt;/strong&gt; running on a vault with a known convention violation injected (e.g., a frontmatter-less note in &lt;code&gt;os/&lt;/code&gt;) produces a report that surfaces it.&lt;/li&gt;\r\n&lt;/ol&gt;\r\n&lt;h3&gt;Phase 4 — &lt;code&gt;/vault-audit&lt;/code&gt; slash command + skill manifest&lt;/h3&gt;\r\n&lt;ol&gt;\r\n&lt;li&gt;&lt;code&gt;SKILL.md&lt;/code&gt; written following the existing skills' frontmatter pattern. &lt;code&gt;name: vault-audit&lt;/code&gt;, &lt;code&gt;description: Vault-wide audit — classify orphans, detect missing MOCs, flag convention violations, suggest QMD-backed links. Read-only, emits report to outputs/&lt;/code&gt;.&lt;/li&gt;\r\n&lt;li&gt;Wire as &lt;code&gt;/vault-audit [orphans|mocs|conventions|excludes|full]&lt;/code&gt;. Default: &lt;code&gt;full&lt;/code&gt;.&lt;/li&gt;\r\n&lt;li&gt;Add to &lt;code&gt;capabilities/skills-index.md&lt;/code&gt; (auto-populated, but a manual entry survives the next regen).&lt;/li&gt;\r\n&lt;/ol&gt;\r\n&lt;h3&gt;Phase 5 — First-run curation + ADR closeout&lt;/h3&gt;\r\n&lt;ol&gt;\r\n&lt;li&gt;Run &lt;code&gt;/vault-audit full&lt;/code&gt; against the live vault.&lt;/li&gt;\r\n&lt;li&gt;Triage the &lt;code&gt;missing-link&lt;/code&gt; and &lt;code&gt;unclassified&lt;/code&gt; buckets manually — fix in batches of 20.&lt;/li&gt;\r\n&lt;li&gt;Update [[2026-04-28-graph-hygiene-tactics]] application checklist: mark \"Re-run orphan audit with stricter rules\" as complete; link to first-run report.&lt;/li&gt;\r\n&lt;li&gt;Decide: do we want a weekly cron to re-run? Probably yes once the report is actionable. Defer to &lt;code&gt;/schedule&lt;/code&gt; after first-run curation proves the rules hold.&lt;/li&gt;\r\n&lt;/ol&gt;\r\n&lt;h2&gt;Verification (end-to-end)&lt;/h2&gt;\r\n&lt;ul&gt;\r\n&lt;li&gt;Skill invocation: &lt;code&gt;/vault-audit full&lt;/code&gt; exits 0, writes &lt;code&gt;outputs/vault-audit/&amp;lt;date&amp;gt;-report.md&lt;/code&gt;, no vault mutations.&lt;/li&gt;\r\n&lt;li&gt;Determinism: two consecutive runs against the same vault produce identical report bodies (hash check).&lt;/li&gt;\r\n&lt;li&gt;Reuse: every classifier component imports from existing &lt;code&gt;.claude/scripts/lib/&lt;/code&gt; — no new frontmatter parser, no new wikilink detector, no new matcher.&lt;/li&gt;\r\n&lt;li&gt;Test coverage: &lt;code&gt;tests/classifier.test.ts&lt;/code&gt; locks the six-label taxonomy with known fixtures.&lt;/li&gt;\r\n&lt;/ul&gt;\r\n&lt;h2&gt;Risks + mitigations&lt;/h2&gt;\r\n&lt;ul&gt;\r\n&lt;li&gt;&lt;strong&gt;QMD latency on full-vault sweep.&lt;/strong&gt; 1,594 notes × N queries could be slow. Mitigation: only the &lt;code&gt;missing-link&lt;/code&gt; bucket gets QMD (typically &amp;lt;&amp;lt; 200 notes), and &lt;code&gt;qmd-suggest.ts&lt;/code&gt; caches by path+mtime.&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;Classifier still too lenient.&lt;/strong&gt; The fix for v1 lenience is the explicit six-label taxonomy + Phase 1 verification against manual curation. If the report after Phase 1 still has &amp;gt; 10% noise, taxonomy gets another rule before Phase 2 ships.&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;Skill scope creep into mutation territory.&lt;/strong&gt; Hard line: this skill never writes to vault notes. Fixes ride on separate scripts (mirroring &lt;code&gt;outputs/index_cleanup.py&lt;/code&gt;'s pattern). If the temptation to add &lt;code&gt;--auto-fix&lt;/code&gt; arises, that's a different skill.&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;Generator regression.&lt;/strong&gt; &lt;code&gt;update-wiki&lt;/code&gt; could re-emit &lt;code&gt;_index.md&lt;/code&gt; files. Mitigation: &lt;code&gt;classifiers/moc.ts&lt;/code&gt; flags any new &lt;code&gt;_index.md&lt;/code&gt; as a hard violation; running &lt;code&gt;/vault-audit&lt;/code&gt; weekly catches regressions within 7 days.&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;Convention drift across client vaults.&lt;/strong&gt; Other client repos (&lt;code&gt;fisch-group&lt;/code&gt;, &lt;code&gt;jid5274&lt;/code&gt;, &lt;code&gt;greg-trading&lt;/code&gt;) have their own vaults. This skill is gbautomation-vault-shaped today; client vaults adopt by copying &lt;code&gt;SKILL.md&lt;/code&gt; + classifier files into their own &lt;code&gt;.claude/skills/vault-audit/&lt;/code&gt;. Cross-vault sharing is a Phase-N concern, not Phase 0.&lt;/li&gt;\r\n&lt;/ul&gt;\r\n&lt;h2&gt;Open questions for spec lock&lt;/h2&gt;\r\n&lt;ol&gt;\r\n&lt;li&gt;~~Skill location~~ — &lt;strong&gt;LOCKED 2026-04-29: root.&lt;/strong&gt; Lives at &lt;code&gt;gbautomation/.claude/skills/vault-audit/&lt;/code&gt;, vault path configured via &lt;code&gt;VAULT_ROOT&lt;/code&gt; env (default &lt;code&gt;second-brain/&lt;/code&gt;). Rationale: we work from &lt;code&gt;gbautomation/&lt;/code&gt;, not from inside the vault.&lt;/li&gt;\r\n&lt;li&gt;Does &lt;code&gt;/vault-audit orphans&lt;/code&gt; ignore the auto-generated &lt;code&gt;_archive/&lt;/code&gt; and &lt;code&gt;intelligence/claude-sessions/&lt;/code&gt; folders by default, or report them with a \"filtered out\" note? Default proposal: ignore by default (matches the graph-hygiene exclude list); add &lt;code&gt;--include-excluded&lt;/code&gt; flag for forensic runs.&lt;/li&gt;\r\n&lt;li&gt;Threshold for QMD-suggested links — start at 0.55 or 0.60? Default proposal: 0.55 + \"weak — review before linking\" tag below 0.65. Tune in Phase 2 verification.&lt;/li&gt;\r\n&lt;/ol&gt;\r\n&lt;/body&gt;\r\n&lt;/html&gt;", "scoreComponents": {"freshness": 94, "typeFit": 92, "nameSignal": 66, "substance": 75}, "baseScore": 82}, {"id": "artifacts/plan-renders/2026-05-16-cc-otel-token-instrumentation/index.html", "path": "artifacts/plan-renders/2026-05-16-cc-otel-token-instrumentation/index.html", "href": "../plan-renders/2026-05-16-cc-otel-token-instrumentation/index.html", "basename": "index.html", "extension": ".html", "kind": "html", "category": "plan", "mime": "text/html", "sizeBytes": 46865, "modifiedAt": "2026-05-19T22:31:36+00:00", "previewText": "&lt;!doctype html&gt;\r\n&lt;html lang=\"en\"&gt;\r\n&lt;head&gt;\r\n  &lt;meta charset=\"utf-8\"&gt;\r\n  &lt;meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"&gt;\r\n  &lt;title&gt;Plan: Capture token usage + 4 adjacent dimensions in cc-otel bootstra nd: rgba(255, 255, 255, .42);\r\n      padding: 9px 10px;\r\n    }\r\n    .meta-item span {\r\n      display: block;\r\n      margin-bottom: 3px;\r\n      color: var(--text-light);\r\n      font-size: 10px;\r\n      font-weight: 700;\r\n      letter-spacing: .12em;\r\n      text-transform: uppercase;\r\n    }\r\n    .meta-item strong {\r\n      display: block;\r\n      overflow-wrap: anywhere;\r\n      color: var(--text-muted);\r\n      font-size: 12px;\r\n      font-weight: 500;\r\n      line-height: 1.35;\r\n    }\r\n    @media (max-width: 860px) {\r\n      .topbar-inner,\r\n      header,\r\n      .layout,\r\n      .footer-inner { padding-left: 16px; padding-right: 16px; }\r\n      .layout { display: block; }\r\n      .section-menu { position: static; margin-bottom: 14px; }\r\n      .section-body { padding-left: 18px; }\r\n      .metadata-grid { grid-template-columns: 1fr; }\r\n    }\r\n    @media (max-width: 540px) {\r\n      .topbar-inner { align-items: flex-start; flex-direction: column; gap: 6px; }\r\n      details.section summary { grid-template-columns: 34px 1fr; }\r\n      .section-count { grid-column: 2; }\r\n      h1 { font-size: 30px; }\r\n    }\r\n  &lt;/style&gt;\r\n&lt;/head&gt;\r\n&lt;body&gt;\r\n  &lt;div class=\"topbar\"&gt;\r\n    &lt;div class=\"topbar-inner\"&gt;\r\n      &lt;div class=\"brand-lockup\"&gt;&lt;span class=\"brand-dot\"&gt;&lt;/span&gt;&lt;span class=\"brand-text\"&gt;GBAutomation&lt;/span&gt;&lt;/div&gt;\r\n      &lt;div class=\"source-name\"&gt;2026-05-16-cc-otel-token-instrumentation.md&lt;/div&gt;\r\n    &lt;/div&gt;\r\n  &lt;/div&gt;\r\n  &lt;header&gt;\r\n    &lt;div class=\"eyebrow\"&gt;Plan Brief&lt;/div&gt;\r\n    &lt;h1&gt;Plan: Capture token usage + 4 adjacent dimensions in cc-otel bootstrap.js&lt;/h1&gt;\r\n    &lt;ul class=\"summary-meta\"&gt;\r\n      &lt;li&gt;Status: ready-to-execute&lt;/li&gt;\r\n      &lt;li&gt;Owner: GBAutomation&lt;/li&gt;\r\n      &lt;li&gt;Priority: high&lt;/li&gt;\r\n      &lt;li&gt;Created: 2026-05-16&lt;/li&gt;\r\n      &lt;li&gt;13 sections&lt;/li&gt;\r\n      &lt;li&gt;2,652 words&lt;/li&gt;\r\n    &lt;/ul&gt;\r\n  &lt;/header&gt;\r\n  &lt;main class=\"layout\"&gt;\r\n    &lt;aside class=\"section-menu\" aria-label=\"Plan sections\"&gt;\r\n  &lt;div class=\"menu-title\"&gt;Sections&lt;/div&gt;\r\n  &lt;div class=\"menu-actions\"&gt;\r\n    &lt;button type=\"button\" data-action=\"expand\"&gt;Expand all&lt;/button&gt;\r\n    &lt;button type=\"button\" data-action=\"collapse\"&gt;Collapse all&lt;/button&gt;\r\n  &lt;/div&gt;\r\n  &lt;nav&gt;&lt;button type=\"button\" data-target=\"overview\"&gt;&lt;span&gt;01&lt;/span&gt;Overview&lt;/button&gt;\r\n&lt;button type=\"button\" data-target=\"context\"&gt;&lt;span&gt;02&lt;/span&gt;Context&lt;/button&gt;\r\n&lt;button type=\"button\" data-target=\"scope\"&gt;&lt;span&gt;03&lt;/span&gt;Scope&lt;/button&gt;\r\n&lt;button type=\"button\" data-target=\"assumptions-locked-during-phase-0-intake\"&gt;&lt;span&gt;04&lt;/span&gt;Assumptions (locked during Phase 0 intake)&lt;/button&gt;\r\n&lt;button type=\"button\" data-target=\"phase-1-ground-tac-scan-results\"&gt;&lt;span&gt;05&lt;/span&gt;Phase 1 — Ground (TAC scan results)&lt;/button&gt;\r\n&lt;button type=\"button\" data-target=\"phase-2-plan-file-by-file\"&gt;&lt;span&gt;06&lt;/span&gt;Phase 2 — Plan (file-by-file)&lt;/button&gt;\r\n&lt;button type=\"button\" data-target=\"phase-3-build-implementation-notes\"&gt;&lt;span&gt;07&lt;/span&gt;Phase 3 — Build (implementation notes)&lt;/button&gt;\r\n&lt;button type=\"button\" data-target=\"phase-4-validate\"&gt;&lt;span&gt;08&lt;/span&gt;Phase 4 — Validate&lt;/button&gt;\r\n&lt;button type=\"button\" data-target=\"phase-5-commit\"&gt;&lt;span&gt;09&lt;/span&gt;Phase 5 — Commit&lt;/button&gt;\r\n&lt;button type=\"button\" data-target=\"risk-register\"&gt;&lt;span&gt;10&lt;/span&gt;Risk register&lt;/button&gt;\r\n&lt;button type=\"button\" data-target=\"rollback\"&gt;&lt;span&gt;11&lt;/span&gt;Rollback&lt;/button&gt;\r\n&lt;button type=\"button\" data-target=\"follow-up-phase-out-of-scope-for-this-pr-separate-plan-when-ready\"&gt;&lt;span&gt;12&lt;/span&gt;Follow-up phase (out of scope for this PR — separate plan when ready)&lt;/button&gt;\r\n&lt;button type=\"button\" data-target=\"execution\"&gt;&lt;span&gt;13&lt;/span&gt;Execution&lt;/button&gt;&lt;/nav&gt;\r\n&lt;/aside&gt;\r\n    &lt;div class=\"sections\"&gt;\r\n      &lt;details class=\"section\" id=\"overview\" open&gt;\r\n  &lt;summary&gt;\r\n    &lt;span class=\"section-index\"&gt;01&lt;/span&gt;\r\n    &lt;span class=\"section-title\"&gt;Overview&lt;/span&gt;\r\n    &lt;span class=\"section-count\"&gt;38 words&lt;/span&gt;\r\n  &lt;/summary&gt;\r\n  &lt;div class=\"section-body\"&gt;\r\n    &lt;blockquote&gt;&lt;p&gt;Generated via tac-coder v1.2 (Phase 0 intake → Phase 1 ground → this plan). Cause: 2026-05-16 Langfuse activity-breakdown showed 0/751 traces in last 24h carry token usage or cost. Companion incident report: &lt;code&gt;second-brain/intelligence/observability/langfuse/2026-05-16-activity-breakdown.md&lt;/code&gt;.&lt;/p&gt;&lt;/blockquote&gt;\r\n  &lt;/div&gt;\r\n&lt;/details&gt;\r\n&lt;details class=\"section\" id=\"context\"&gt;\r\n  &lt;summary&gt;\r\n    &lt;span class=\"section-index\"&gt;02&lt;/span&gt;\r\n    &lt;span class=\"section-title\"&gt;Context&lt;/span&gt;\r\n    &lt;span class=\"section-count\"&gt;156 words&lt;/span&gt;\r\n  &lt;/summary&gt;\r\n  &lt;div class=\"section-body\"&gt;\r\n    &lt;p&gt;&lt;code&gt;resources/cc-otel/bootstrap.js&lt;/code&gt; monkey-patches &lt;code&gt;globalThis.fetch&lt;/code&gt; inside every Node-based agent invocation that loads it via &lt;code&gt;NODE_OPTIONS=--require=…/bootstrap.js&lt;/code&gt;. This includes interactive claude-code on Windows + Mac, the Linear cron coding agent on the mini, and any Hermes/OpenClaw call that shells out to a claude subprocess. &lt;strong&gt;One bootstrap, many producers.&lt;/strong&gt;&lt;/p&gt;\r\n&lt;p&gt;The hook currently captures HTTP-level facts (&lt;code&gt;http.url&lt;/code&gt;, &lt;code&gt;http.method&lt;/code&gt;, &lt;code&gt;http.route&lt;/code&gt;, &lt;code&gt;http.status_code&lt;/code&gt;, &lt;code&gt;http.duration_ms&lt;/code&gt;, &lt;code&gt;llm.request.model&lt;/code&gt;, &lt;code&gt;llm.input.preview&lt;/code&gt;, plus &lt;code&gt;cc.repo&lt;/code&gt;, &lt;code&gt;cc.branch&lt;/code&gt;, &lt;code&gt;cc.cwd&lt;/code&gt;) and ends the span the instant response headers arrive. It never reads the response body. Anthropic&amp;#x27;s &lt;code&gt;/v1/messages&lt;/code&gt; response always carries a &lt;code&gt;usage&lt;/code&gt; block (&lt;code&gt;input_tokens&lt;/code&gt;, &lt;code&gt;output_tokens&lt;/code&gt;, &lt;code&gt;cache_creation_input_tokens&lt;/code&gt;, &lt;code&gt;cache_read_input_tokens&lt;/code&gt;) plus a &lt;code&gt;stop_reason&lt;/code&gt;. None of it lands in Langfuse.&lt;/p&gt;\r\n&lt;p&gt;This phase teaches the hook to read the response body for non-streaming requests, extract the usage block + stop reason + response headers + first 500 chars of output text, and emit them as OTel attributes that Langfuse Cloud auto-derives cost from.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/details&gt;\r\n&lt;details class=\"section\" id=\"scope\"&gt;\r\n  &lt;summary&gt;\r\n    &lt;span class=\"section-index\"&gt;03&lt;/span&gt;\r\n    &lt;span class=\"section-title\"&gt;Scope&lt;/span&gt;\r\n    &lt;span class=\"section-count\"&gt;318 words&lt;/span&gt;\r\n  &lt;/summary&gt;\r\n  &lt;div class=\"section-body\"&gt;\r\n    &lt;h4&gt;In scope (one PR, one rollout cycle)&lt;/h4&gt;\r\n&lt;ol&gt;\r\n&lt;li&gt;&lt;strong&gt;Token usage&lt;/strong&gt; — &lt;code&gt;input_tokens&lt;/code&gt; / &lt;code&gt;output_tokens&lt;/code&gt; from response body&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;Prompt-cache tokens&lt;/strong&gt; — &lt;code&gt;cache_creation_input_tokens&lt;/code&gt; / &lt;code&gt;cache_read_input_tokens&lt;/code&gt; from response body&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;&lt;code&gt;stop_reason&lt;/code&gt;&lt;/strong&gt; — from response body&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;Output preview&lt;/strong&gt; — first 500 chars of first text block, no redaction (per intake Q3)&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;Rate-limit headers&lt;/strong&gt; — &lt;code&gt;anthropic-ratelimit-{requests,tokens}-{limit,remaining,reset}&lt;/code&gt; from response headers&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;Trace session linking&lt;/strong&gt; — &lt;code&gt;CLAUDE_SESSION_ID&lt;/code&gt; env or process-uuid fallback → Langfuse session_id&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;Invocation source&lt;/strong&gt; — &lt;code&gt;source:tty | piped | cron&lt;/code&gt; tag derived at bootstrap start&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;Streaming fail-loud&lt;/strong&gt; — detect SSE responses and emit &lt;code&gt;gen_ai.usage.captured=false reason=streaming&lt;/code&gt; instead of silent zero&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;Smoke test&lt;/strong&gt; — &lt;code&gt;resources/cc-otel/scripts/smoke-token-capture.sh&lt;/code&gt; runs &lt;code&gt;claude -p&lt;/code&gt; + waits + reads back from Langfuse via existing &lt;code&gt;langfuse_activity_breakdown.py&lt;/code&gt; and asserts &lt;code&gt;Sum output tokens &amp;gt; 0&lt;/code&gt; from the last hour&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;Unit test&lt;/strong&gt; — &lt;code&gt;resources/cc-otel/bootstrap.test.js&lt;/code&gt; with stubbed fetch covering: non-streaming JSON response with usage, streaming response (fail-loud branch), non-Anthropic URL (untouched passthrough), and the source/session tag wiring&lt;/li&gt;\r\n&lt;/ol&gt;\r\n&lt;h4&gt;Out of scope (explicit non-goals)&lt;/h4&gt;\r\n&lt;ul&gt;\r\n&lt;li&gt;&lt;strong&gt;Streaming response body parsing&lt;/strong&gt; — deferred. SSE wrap is its own ~40 LOC; we land the non-streaming win first, validate against Anthropic billing for a known day, then do streaming as a follow-up (see &amp;quot;Follow-up phase&amp;quot; below).&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;Tool-use child spans&lt;/strong&gt; — assistant &lt;code&gt;tool_use&lt;/code&gt; blocks are not parsed into separate observations in this phase.&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;LLM-as-judge &lt;code&gt;scores&lt;/code&gt; push&lt;/strong&gt; — separate cron, separate skill; tracked in &lt;code&gt;second-brain/tasks/feedback-loops/L18-nightly-langfuse-dream-review.md&lt;/code&gt;.&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;File-extension / per-file token attribution&lt;/strong&gt; — requires tool_use parsing first.&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;Tier-3-only trace-linking deeper than session_id&lt;/strong&gt; — no parent/child span linking across separate claude-code invocations.&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;Hermes / OpenClaw direct SDK paths&lt;/strong&gt; — covered automatically when they shell out to &lt;code&gt;claude&lt;/code&gt;; not covered when they call Anthropic SDK directly. A separate Hermes-side wrapper phase handles those.&lt;/li&gt;\r\n&lt;/ul&gt;\r\n&lt;h4&gt;Boundary contract&lt;/h4&gt;\r\n&lt;p&gt;This phase touches &lt;strong&gt;only&lt;/strong&gt; &lt;code&gt;resources/cc-otel/&lt;/code&gt;. No edits to Hermes, OpenClaw, Langfuse, the Linear cron, or any plist. After deploy, the existing 514 mac-mini claude-code traces and the existing 29 Hermes-via-subprocess traces start carrying usage; everything else is unchanged.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/details&gt;\r\n&lt;details class=\"section\" id=\"assumptions-locked-during-phase-0-intake\"&gt;\r\n  &lt;summary&gt;\r\n    &lt;span class=\"section-index\"&gt;04&lt;/span&gt;\r\n    &lt;span class=\"section-title\"&gt;Assumptions (locked during Phase 0 intake)&lt;/span&gt;\r\n    &lt;span class=\"section-count\"&gt;174 words&lt;/span&gt;\r\n  &lt;/summary&gt;\r\n  &lt;div class=\"section-body\"&gt;\r\n    &lt;div class=\"table-wrap\"&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;ID&lt;/th&gt;&lt;th&gt;Assumption&lt;/th&gt;&lt;th&gt;Source&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;A1&lt;/td&gt;&lt;td&gt;Scope is Tiers 1–5 in one phase&lt;/td&gt;&lt;td&gt;Intake Q1&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;A2&lt;/td&gt;&lt;td&gt;Streaming responses are deferred; fail-loud marker on streaming spans&lt;/td&gt;&lt;td&gt;Intake Q2&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;A3&lt;/td&gt;&lt;td&gt;Output preview captured as 500-char truncation, no redaction&lt;/td&gt;&lt;td&gt;Intake Q3&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;A4&lt;/td&gt;&lt;td&gt;Smoke test is live &lt;code&gt;claude -p&lt;/code&gt; + &lt;code&gt;langfuse_activity_breakdown.py --hours 1&lt;/code&gt; asserting &lt;code&gt;Sum output &amp;gt; 0&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Intake Q4&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;A5&lt;/td&gt;&lt;td&gt;Anchor on OTel GenAI semantic conventions (&lt;code&gt;gen_ai.usage.input_tokens&lt;/code&gt;, &lt;code&gt;gen_ai.usage.output_tokens&lt;/code&gt;, &lt;code&gt;gen_ai.response.stop_reason&lt;/code&gt;) plus Langfuse-specific &lt;code&gt;langfuse.observation.usage_details&lt;/code&gt; JSON for auto-cost-derivation&lt;/td&gt;&lt;td&gt;Default — Langfuse OTel mapping is published, no other anchor proposed&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;A6&lt;/td&gt;&lt;td&gt;&lt;code&gt;claude -p&lt;/code&gt; invocations are non-streaming by default (the &lt;code&gt;--stream&lt;/code&gt; flag exists but is opt-in). Most existing 514 mac-mini traces will be covered by the non-streaming path&lt;/td&gt;&lt;td&gt;Source: &lt;code&gt;claude --help&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;A7&lt;/td&gt;&lt;td&gt;Anthropic prompt-cache &lt;code&gt;cache_control&lt;/code&gt; TTL (5m vs 1h) is on the REQUEST body, not the RESPONSE — we don&amp;#x27;t capture this in this phase; deferred to optional follow-up&lt;/td&gt;&lt;td&gt;Source: Anthropic API docs&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;A8&lt;/td&gt;&lt;td&gt;&lt;code&gt;CLAUDE_SESSION_ID&lt;/code&gt; env may not be set by claude-code today. Fallback: generate one UUID per bootstrap load with &lt;code&gt;crypto.randomUUID()&lt;/code&gt;. Process-scoped, not per-turn&lt;/td&gt;&lt;td&gt;Defensive default&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;\r\n  &lt;/div&gt;\r\n&lt;/details&gt;\r\n&lt;details class=\"section\" id=\"phase-1-ground-tac-scan-results\"&gt;\r\n  &lt;summary&gt;\r\n    &lt;span class=\"section-index\"&gt;05&lt;/span&gt;\r\n    &lt;span class=\"section-title\"&gt;Phase 1 — Ground (TAC scan results)&lt;/span&gt;\r\n    &lt;span class=\"section-count\"&gt;168 words&lt;/span&gt;\r\n  &lt;/summary&gt;\r\n  &lt;div class=\"section-body\"&gt;\r\n    &lt;div class=\"table-wrap\"&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Source&lt;/th&gt;&lt;th&gt;Hit&lt;/th&gt;&lt;th&gt;Reuse?&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;second-brain/knowledge/tac-kb.md&lt;/code&gt; (compiled 30-source bundle)&lt;/td&gt;&lt;td&gt;No prior &lt;code&gt;cc-otel&lt;/code&gt;/&lt;code&gt;bootstrap.js&lt;/code&gt;/&lt;code&gt;gen_ai.usage&lt;/code&gt;/Anthropic-fetch-wrapper component&lt;/td&gt;&lt;td&gt;TAC-no-match — documented&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;&lt;code&gt;~/repos/the-library/library.yaml&lt;/code&gt; (Mac-mini side, per tac-coder Phase 1 step 1)&lt;/td&gt;&lt;td&gt;_execution: skip — current cc-otel bootstrap is itself the prior art; we&amp;#x27;re extending it, not reinventing_&lt;/td&gt;&lt;td&gt;Extend&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;&lt;code&gt;resources/cc-otel/bootstrap.js&lt;/code&gt;&lt;/td&gt;&lt;td&gt;This phase&amp;#x27;s edit target — preserves OTel setup, exporter wiring, repo-detection, tag composition&lt;/td&gt;&lt;td&gt;Extend&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;&lt;code&gt;resources/lib/tracing.py&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Python-side tracing helper; out of scope here (no Python edits)&lt;/td&gt;&lt;td&gt;N/A&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;&lt;code&gt;scripts/setup_codex_langfuse.py&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Sets &lt;code&gt;LANGFUSE_OTEL_*&lt;/code&gt; envs for codex; unrelated to bootstrap.js content&lt;/td&gt;&lt;td&gt;N/A&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;Langfuse OTel docs (https://langfuse.com/docs/integrations/opentelemetry/example-otel)&lt;/td&gt;&lt;td&gt;Reference architecture — &lt;code&gt;langfuse.observation.usage_details&lt;/code&gt; JSON attr maps directly to cost catalog&lt;/td&gt;&lt;td&gt;Anchor&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;OpenInference GenAI semconv (https://github.com/Arize-ai/openinference/blob/main/spec/semantic_conventions.md)&lt;/td&gt;&lt;td&gt;&lt;code&gt;gen_ai.usage.input_tokens&lt;/code&gt; / &lt;code&gt;gen_ai.usage.output_tokens&lt;/code&gt; / &lt;code&gt;gen_ai.response.stop_reason&lt;/code&gt; — standard attribute names&lt;/td&gt;&lt;td&gt;Anchor&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;\r\n&lt;p&gt;TAC reuse policy (feedback_tac_first_reuse_policy) satisfied: extending an existing component, no new agent / skill / hook / command / ADW. KB-no-match on the specific patch documented.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/details&gt;\r\n&lt;details class=\"section\" id=\"phase-2-plan-file-by-file\"&gt;\r\n  &lt;summary&gt;\r\n    &lt;span class=\"section-index\"&gt;06&lt;/span&gt;\r\n    &lt;span class=\"section-title\"&gt;Phase 2 — Plan (file-by-file)&lt;/span&gt;\r\n    &lt;span class=\"section-count\"&gt;425 words&lt;/span&gt;\r\n  &lt;/summary&gt;\r\n  &lt;div class=\"section-body\"&gt;\r\n    &lt;div class=\"table-wrap\"&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;File&lt;/th&gt;&lt;th&gt;Action&lt;/th&gt;&lt;th&gt;Net LOC&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;resources/cc-otel/bootstrap.js&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Extend the &lt;code&gt;patchedFetch&lt;/code&gt; wrapper inside the &lt;code&gt;globalThis.fetch&lt;/code&gt; monkey-patch to: (i) detect streaming vs non-streaming via response &lt;code&gt;content-type&lt;/code&gt;, (ii) for non-streaming, clone the response, parse JSON body, extract usage/stop_reason/first-text-block, (iii) for streaming, set fail-loud attrs, (iv) capture rate-limit headers from response headers, (v) add &lt;code&gt;source:&lt;/code&gt; tag derived at module load, (vi) add session_id resolved from &lt;code&gt;CLAUDE_SESSION_ID&lt;/code&gt; or generated UUID.&lt;/td&gt;&lt;td&gt;+~80&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;&lt;code&gt;resources/cc-otel/bootstrap.test.js&lt;/code&gt;&lt;/td&gt;&lt;td&gt;New file. Node native test runner (&lt;code&gt;node --test&lt;/code&gt;). Four test cases per the In-Scope #10 enumeration. No network — fetch is stubbed.&lt;/td&gt;&lt;td&gt;+~120&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;&lt;code&gt;resources/cc-otel/scripts/smoke-token-capture.sh&lt;/code&gt;&lt;/td&gt;&lt;td&gt;New file. Runs &lt;code&gt;claude -p &amp;quot;say hi&amp;quot;&lt;/code&gt; on host with cc-otel loaded, sleeps 60s for OTel batch flush, then invokes &lt;code&gt;python resources/skills/check-langfuse-logs/scripts/langfuse_activity_breakdown.py --hours 1&lt;/code&gt; and greps the output for &lt;code&gt;Sum input/output/total tokens&lt;/code&gt; — fails if all three are 0.&lt;/td&gt;&lt;td&gt;+~25&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;&lt;code&gt;resources/cc-otel/README.md&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Document the new attributes table (attribute name → source → Langfuse mapping) so future maintainers know the contract.&lt;/td&gt;&lt;td&gt;+~40&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;&lt;code&gt;resources/cc-otel/package.json&lt;/code&gt;&lt;/td&gt;&lt;td&gt;No change — only stdlib modules used (&lt;code&gt;crypto.randomUUID&lt;/code&gt;, existing &lt;code&gt;@opentelemetry/*&lt;/code&gt; already present).&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;Deploy targets&lt;/td&gt;&lt;td&gt;After merge: rsync &lt;code&gt;bootstrap.js&lt;/code&gt; to &lt;code&gt;~/.cc-otel/bootstrap.js&lt;/code&gt; on the Windows dev box AND on the Mac mini (per existing convention — both hosts already reference this path in their &lt;code&gt;NODE_OPTIONS&lt;/code&gt;). Rsync step lives in the smoke-test runbook, not in this code.&lt;/td&gt;&lt;td&gt;0&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;\r\n&lt;h4&gt;Attribute contract (new attrs emitted on each Anthropic &lt;code&gt;/v1/messages&lt;/code&gt; span)&lt;/h4&gt;\r\n&lt;div class=\"table-wrap\"&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;OTel attribute&lt;/th&gt;&lt;th&gt;Source&lt;/th&gt;&lt;th&gt;Notes&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;gen_ai.usage.input_tokens&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;body.usage.input_tokens&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;&lt;code&gt;gen_ai.usage.output_tokens&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;body.usage.output_tokens&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;&lt;code&gt;gen_ai.usage.cache_creation_input_tokens&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;body.usage.cache_creation_input_tokens&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Anthropic-specific extension&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;&lt;code&gt;gen_ai.usage.cache_read_input_tokens&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;body.usage.cache_read_input_tokens&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Anthropic-specific extension&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;&lt;code&gt;gen_ai.response.stop_reason&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;body.stop_reason&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;end_turn&lt;/code&gt; / &lt;code&gt;max_tokens&lt;/code&gt; / &lt;code&gt;tool_use&lt;/code&gt; / &lt;code&gt;stop_sequence&lt;/code&gt;&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;&lt;code&gt;gen_ai.usage.captured&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;true&lt;/code&gt; for non-streaming, &lt;code&gt;false&lt;/code&gt; for streaming&lt;/td&gt;&lt;td&gt;Fail-loud marker&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;&lt;code&gt;gen_ai.usage.capture_skip_reason&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;streaming&lt;/code&gt; when applicable&lt;/td&gt;&lt;td&gt;Diagnostic&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;&lt;code&gt;llm.output.preview&lt;/code&gt;&lt;/td&gt;&lt;td&gt;First 500 chars of first &lt;code&gt;body.content[].text&lt;/code&gt; block&lt;/td&gt;&lt;td&gt;Matches existing &lt;code&gt;llm.input.preview&lt;/code&gt; pattern&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;&lt;code&gt;langfuse.observation.usage_details&lt;/code&gt;&lt;/td&gt;&lt;td&gt;JSON-stringified &lt;code&gt;{&amp;quot;input&amp;quot;:N,&amp;quot;output&amp;quot;:N,&amp;quot;cache_creation&amp;quot;:N,&amp;quot;cache_read&amp;quot;:N}&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Triggers Langfuse cost auto-derivation&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;&lt;code&gt;langfuse.observation.model.name&lt;/code&gt;&lt;/td&gt;&lt;td&gt;Resolved model name (same as &lt;code&gt;llm.request.model&lt;/code&gt;)&lt;/td&gt;&lt;td&gt;Required for Langfuse cost catalog lookup&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;&lt;code&gt;langfuse.trace.session_id&lt;/code&gt;&lt;/td&gt;&lt;td&gt;&lt;code&gt;process.env.CLAUDE_SESSION_ID&lt;/code&gt; or generated per-process UUID&lt;/td&gt;&lt;td&gt;Rolls multi-fetch turns into one Langfuse session&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;&lt;code&gt;http.response.header.anthropic_ratelimit_requests_limit&lt;/code&gt;&lt;/td&gt;&lt;td&gt;response header&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;&lt;code&gt;http.response.header.anthropic_ratelimit_requests_remaining&lt;/code&gt;&lt;/td&gt;&lt;td&gt;response header&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;&lt;code&gt;http.response.header.anthropic_ratelimit_tokens_limit&lt;/code&gt;&lt;/td&gt;&lt;td&gt;response header&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;&lt;code&gt;http.response.header.anthropic_ratelimit_tokens_remaining&lt;/code&gt;&lt;/td&gt;&lt;td&gt;response header&lt;/td&gt;&lt;td&gt;&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;&lt;code&gt;http.response.header.anthropic_ratelimit_tokens_reset&lt;/code&gt;&lt;/td&gt;&lt;td&gt;response header&lt;/td&gt;&lt;td&gt;ISO timestamp&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;(existing tag list) `source:tty\\&lt;/td&gt;&lt;td&gt;piped\\&lt;/td&gt;&lt;td&gt;cron`&lt;/td&gt;&lt;td&gt;derived at bootstrap load&lt;/td&gt;&lt;td&gt;&lt;code&gt;tty&lt;/code&gt; if &lt;code&gt;process.stdin.isTTY&lt;/code&gt;, &lt;code&gt;cron&lt;/code&gt; if `CRON \\&lt;/td&gt;&lt;td&gt;\\&lt;/td&gt;&lt;td&gt;GITHUB_ACTIONS \\&lt;/td&gt;&lt;td&gt;\\&lt;/td&gt;&lt;td&gt;CLAUDE_CODE_NONINTERACTIVE&lt;code&gt;, else &lt;/code&gt;piped`&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;\r\n  &lt;/div&gt;\r\n&lt;/details&gt;\r\n&lt;details class=\"section\" id=\"phase-3-build-implementation-notes\"&gt;\r\n  &lt;summary&gt;\r\n    &lt;span class=\"section-index\"&gt;07&lt;/span&gt;\r\n    &lt;span class=\"section-title\"&gt;Phase 3 — Build (implementation notes)&lt;/span&gt;\r\n    &lt;span class=\"section-count\"&gt;444 words&lt;/span&gt;\r\n  &lt;/summary&gt;\r\n  &lt;div class=\"section-body\"&gt;\r\n    &lt;ol&gt;\r\n&lt;li&gt;&lt;strong&gt;Module-load-time additions&lt;/strong&gt; (above the existing &lt;code&gt;globalThis.fetch&lt;/code&gt; patch):&lt;/li&gt;\r\n&lt;/ol&gt;\r\n&lt;pre&gt;&lt;code&gt;   const { randomUUID } = require(&amp;#x27;crypto&amp;#x27;);\r\n   const _sessionId = process.env.CLAUDE_SESSION_ID || randomUUID();\r\n   const _invocationSource = (\r\n     process.env.CRON || process.env.GITHUB_ACTIONS || process.env.CLAUDE_CODE_NONINTERACTIVE\r\n       ? &amp;#x27;cron&amp;#x27;\r\n       : (process.stdin &amp;amp;&amp;amp; process.stdin.isTTY ? &amp;#x27;tty&amp;#x27; : &amp;#x27;piped&amp;#x27;)\r\n   );&lt;/code&gt;&lt;/pre&gt;\r\n&lt;ol&gt;\r\n&lt;li&gt;&lt;strong&gt;Inside &lt;code&gt;patchedFetch&lt;/code&gt;, replace the current post-response block&lt;/strong&gt; (currently 4 lines: status, duration, end, return) with a branched read:&lt;/li&gt;\r\n&lt;/ol&gt;\r\n&lt;pre&gt;&lt;code&gt;   const res = await originalFetch.apply(this, arguments);\r\n   span.setAttribute(&amp;#x27;http.status_code&amp;#x27;, res.status);\r\n   span.setAttribute(&amp;#x27;http.duration_ms&amp;#x27;, Date.now() - t0);\r\n\r\n   // Rate-limit headers — always captured, no body read needed\r\n   for (const h of [\r\n     &amp;#x27;anthropic-ratelimit-requests-limit&amp;#x27;,\r\n     &amp;#x27;anthropic-ratelimit-requests-remaining&amp;#x27;,\r\n     &amp;#x27;anthropic-ratelimit-tokens-limit&amp;#x27;,\r\n     &amp;#x27;anthropic-ratelimit-tokens-remaining&amp;#x27;,\r\n     &amp;#x27;anthropic-ratelimit-tokens-reset&amp;#x27;,\r\n   ]) {\r\n     const v = res.headers.get(h);\r\n     if (v !== null) {\r\n       span.setAttribute(&amp;#x27;http.response.header.&amp;#x27; + h.replace(/-/g, &amp;#x27;_&amp;#x27;), v);\r\n     }\r\n   }\r\n\r\n   // Body read — non-streaming only\r\n   const ct = res.headers.get(&amp;#x27;content-type&amp;#x27;) || &amp;#x27;&amp;#x27;;\r\n   if (ct.includes(&amp;#x27;text/event-stream&amp;#x27;)) {\r\n     span.setAttribute(&amp;#x27;gen_ai.usage.captured&amp;#x27;, false);\r\n     span.setAttribute(&amp;#x27;gen_ai.usage.capture_skip_reason&amp;#x27;, &amp;#x27;streaming&amp;#x27;);\r\n   } else if (ct.includes(&amp;#x27;application/json&amp;#x27;) &amp;amp;&amp;amp; res.status === 200) {\r\n     try {\r\n       const body = await res.clone().json();\r\n       const u = body.usage || {};\r\n       if (typeof u.input_tokens === &amp;#x27;number&amp;#x27;) {\r\n         span.setAttribute(&amp;#x27;gen_ai.usage.input_tokens&amp;#x27;, u.input_tokens);\r\n       }\r\n       if (typeof u.output_tokens === &amp;#x27;number&amp;#x27;) {\r\n         span.setAttribute(&amp;#x27;gen_ai.usage.output_tokens&amp;#x27;, u.output_tokens);\r\n       }\r\n       if (typeof u.cache_creation_input_tokens === &amp;#x27;number&amp;#x27;) {\r\n         span.setAttribute(&amp;#x27;gen_ai.usage.cache_creation_input_tokens&amp;#x27;, u.cache_creation_input_tokens);\r\n       }\r\n       if (typeof u.cache_read_input_tokens === &amp;#x27;number&amp;#x27;) {\r\n         span.setAttribute(&amp;#x27;gen_ai.usage.cache_read_input_tokens&amp;#x27;, u.cache_read_input_tokens);\r\n       }\r\n       if (body.stop_reason) {\r\n         span.setAttribute(&amp;#x27;gen_ai.response.stop_reason&amp;#x27;, body.stop_reason);\r\n       }\r\n       // Langfuse cost-derivation pair — emitted only when we have model + tokens\r\n       if (model &amp;amp;&amp;amp; typeof u.input_tokens === &amp;#x27;number&amp;#x27;) {\r\n         span.setAttribute(&amp;#x27;langfuse.observation.model.name&amp;#x27;, model);\r\n         span.setAttribute(&amp;#x27;langfuse.observation.usage_details&amp;#x27;, JSON.stringify({\r\n           input: u.input_tokens || 0,\r\n           output: u.output_tokens || 0,\r\n           cache_creation: u.cache_creation_input_tokens || 0,\r\n           cache_read: u.cache_read_input_tokens || 0,\r\n         }));\r\n       }\r\n       // Output text preview — first text block, 500 chars\r\n       if (Array.isArray(body.content)) {\r\n         const txt = body.content.find((c) =&amp;gt; c &amp;amp;&amp;amp; c.type === &amp;#x27;text&amp;#x27;);\r\n         if (txt &amp;amp;&amp;amp; typeof txt.text === &amp;#x27;string&amp;#x27;) {\r\n           span.setAttribute(&amp;#x27;llm.output.preview&amp;#x27;, txt.text.slice(0, 500));\r\n         }\r\n       }\r\n       span.setAttribute(&amp;#x27;gen_ai.usage.captured&amp;#x27;, true);\r\n     } catch (e) {\r\n       span.setAttribute(&amp;#x27;gen_ai.usage.captured&amp;#x27;, false);\r\n       span.setAttribute(&amp;#x27;gen_ai.usage.capture_skip_reason&amp;#x27;, &amp;#x27;parse_error&amp;#x27;);\r\n     }\r\n   }\r\n\r\n   span.end();\r\n   return res;&lt;/code&gt;&lt;/pre&gt;\r\n&lt;ol&gt;\r\n&lt;li&gt;&lt;strong&gt;Tag list amendments&lt;/strong&gt; — extend the &lt;code&gt;tags&lt;/code&gt; array assembly to push &lt;code&gt;source:${_invocationSource}&lt;/code&gt; and set &lt;code&gt;span.setAttribute(&amp;#x27;langfuse.trace.session_id&amp;#x27;, _sessionId)&lt;/code&gt;.&lt;/li&gt;\r\n&lt;/ol&gt;\r\n&lt;ol&gt;\r\n&lt;li&gt;&lt;strong&gt;Implementation-time guardrails&lt;/strong&gt;:&lt;/li&gt;\r\n&lt;/ol&gt;\r\n&lt;ul&gt;\r\n&lt;li&gt;&lt;code&gt;res.clone()&lt;/code&gt; is essential — calling &lt;code&gt;res.json()&lt;/code&gt; on the original would consume the body and break the downstream consumer (claude-code&amp;#x27;s cli.js bundle).&lt;/li&gt;\r\n&lt;li&gt;JSON parse is wrapped in try/catch — any non-Anthropic-shaped body (error response, unexpected content) falls through to the fail-loud branch.&lt;/li&gt;\r\n&lt;li&gt;Streaming detection uses &lt;code&gt;content-type: text/event-stream&lt;/code&gt; from response headers (Anthropic&amp;#x27;s confirmed SSE marker), not request body inspection (which would race with body serialization timing).&lt;/li&gt;\r\n&lt;li&gt;The &lt;code&gt;gen_ai.usage.captured&lt;/code&gt; attribute is set in &lt;strong&gt;both&lt;/strong&gt; branches so a span without it indicates an unhandled code path — easier to spot regressions.&lt;/li&gt;\r\n&lt;/ul&gt;\r\n  &lt;/div&gt;\r\n&lt;/details&gt;\r\n&lt;details class=\"section\" id=\"phase-4-validate\"&gt;\r\n  &lt;summary&gt;\r\n    &lt;span class=\"section-index\"&gt;08&lt;/span&gt;\r\n    &lt;span class=\"section-title\"&gt;Phase 4 — Validate&lt;/span&gt;\r\n    &lt;span class=\"section-count\"&gt;380 words&lt;/span&gt;\r\n  &lt;/summary&gt;\r\n  &lt;div class=\"section-body\"&gt;\r\n    &lt;h4&gt;Smoke test (per A4)&lt;/h4&gt;\r\n&lt;pre&gt;&lt;code&gt;bash resources/cc-otel/scripts/smoke-token-capture.sh&lt;/code&gt;&lt;/pre&gt;\r\n&lt;p&gt;Script behavior:&lt;/p&gt;\r\n&lt;ol&gt;\r\n&lt;li&gt;Records current UTC time as &lt;code&gt;T0&lt;/code&gt;.&lt;/li&gt;\r\n&lt;li&gt;Runs &lt;code&gt;NODE_OPTIONS=--require=$PWD/resources/cc-otel/bootstrap.js claude -p &amp;quot;Say only the word OK&amp;quot; --model claude-haiku-4-5-20251001 --no-session-persistence&lt;/code&gt; once on whichever host is running it.&lt;/li&gt;\r\n&lt;li&gt;Asserts exit code 0 and stdout contains &lt;code&gt;OK&lt;/code&gt;.&lt;/li&gt;\r\n&lt;li&gt;Sleeps 75s (60s OTel batch + 15s Langfuse Cloud ingest lag).&lt;/li&gt;\r\n&lt;li&gt;Runs &lt;code&gt;python resources/skills/check-langfuse-logs/scripts/langfuse_activity_breakdown.py --hours 1&lt;/code&gt; capturing stdout.&lt;/li&gt;\r\n&lt;li&gt;Greps for &lt;code&gt;Sum input/output/total tokens:&lt;/code&gt; line; asserts all three numbers &amp;gt; 0.&lt;/li&gt;\r\n&lt;li&gt;Greps for &lt;code&gt;claude-haiku-4-5-20251001&lt;/code&gt; in the model table; asserts &lt;code&gt;Out tok&lt;/code&gt; column &amp;gt; 0 for that row.&lt;/li&gt;\r\n&lt;li&gt;Exit 0 (PASS) or 1 (FAIL) with explicit reason on FAIL.&lt;/li&gt;\r\n&lt;/ol&gt;\r\n&lt;h4&gt;Unit test&lt;/h4&gt;\r\n&lt;pre&gt;&lt;code&gt;node --test resources/cc-otel/bootstrap.test.js&lt;/code&gt;&lt;/pre&gt;\r\n&lt;p&gt;Four test cases:&lt;/p&gt;\r\n&lt;ol&gt;\r\n&lt;li&gt;&lt;strong&gt;Non-streaming JSON with usage&lt;/strong&gt; — stub fetch returns &lt;code&gt;{status:200, headers:{content-type:&amp;#x27;application/json&amp;#x27;}, body:{usage:{input_tokens:123, output_tokens:45, cache_read_input_tokens:67}, stop_reason:&amp;#x27;end_turn&amp;#x27;, content:[{type:&amp;#x27;text&amp;#x27;, text:&amp;#x27;hi&amp;#x27;}]}}&lt;/code&gt;. Assert span has &lt;code&gt;gen_ai.usage.input_tokens=123&lt;/code&gt;, &lt;code&gt;gen_ai.usage.output_tokens=45&lt;/code&gt;, &lt;code&gt;gen_ai.usage.cache_read_input_tokens=67&lt;/code&gt;, &lt;code&gt;gen_ai.response.stop_reason=&amp;#x27;end_turn&amp;#x27;&lt;/code&gt;, &lt;code&gt;llm.output.preview=&amp;#x27;hi&amp;#x27;&lt;/code&gt;, &lt;code&gt;gen_ai.usage.captured=true&lt;/code&gt;, and the Langfuse JSON-encoded usage_details parses correctly.&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;Streaming response&lt;/strong&gt; — stub returns &lt;code&gt;{status:200, headers:{content-type:&amp;#x27;text/event-stream&amp;#x27;}}&lt;/code&gt;. Assert span has &lt;code&gt;gen_ai.usage.captured=false&lt;/code&gt; and &lt;code&gt;gen_ai.usage.capture_skip_reason=&amp;#x27;streaming&amp;#x27;&lt;/code&gt;. Body is NOT consumed.&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;Non-Anthropic URL passthrough&lt;/strong&gt; — stub fetch is called with &lt;code&gt;https://example.com&lt;/code&gt;. Assert no spans created (passthrough untouched).&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;Source + session_id wiring&lt;/strong&gt; — with &lt;code&gt;CLAUDE_SESSION_ID=test-sess-123&lt;/code&gt; env set, assert &lt;code&gt;langfuse.trace.session_id=&amp;#x27;test-sess-123&amp;#x27;&lt;/code&gt;. Without the env, assert a v4 UUID format on the same attr. With &lt;code&gt;process.stdin.isTTY=false&lt;/code&gt; and no &lt;code&gt;CRON&lt;/code&gt; env, assert &lt;code&gt;source:piped&lt;/code&gt; in the JSON-encoded &lt;code&gt;langfuse.trace.tags&lt;/code&gt;.&lt;/li&gt;\r\n&lt;/ol&gt;\r\n&lt;h4&gt;Success criteria&lt;/h4&gt;\r\n&lt;div class=\"table-wrap\"&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;#&lt;/th&gt;&lt;th&gt;Criterion&lt;/th&gt;&lt;th&gt;Source&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;C1&lt;/td&gt;&lt;td&gt;&lt;code&gt;node --test resources/cc-otel/bootstrap.test.js&lt;/code&gt; exits 0 (4/4 tests pass)&lt;/td&gt;&lt;td&gt;Unit&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;C2&lt;/td&gt;&lt;td&gt;Smoke test exits 0 with non-zero token sums in the last-hour activity breakdown&lt;/td&gt;&lt;td&gt;A4&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;C3&lt;/td&gt;&lt;td&gt;Existing claude-code traces in Langfuse Cloud, after rsync deploy, show &lt;code&gt;Sum totalCost &amp;gt; 0&lt;/code&gt; in the next 24h activity-breakdown run&lt;/td&gt;&lt;td&gt;Live&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;C4&lt;/td&gt;&lt;td&gt;No regression in existing attrs (&lt;code&gt;cc.repo&lt;/code&gt;, &lt;code&gt;cc.branch&lt;/code&gt;, &lt;code&gt;llm.request.model&lt;/code&gt;, tag list) — verified by diffing one trace&amp;#x27;s metadata pre/post&lt;/td&gt;&lt;td&gt;Live&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;C5&lt;/td&gt;&lt;td&gt;At least one Hermes-via-claude-subprocess trace also shows new token attrs (proves cross-producer coverage)&lt;/td&gt;&lt;td&gt;Live&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;\r\n  &lt;/div&gt;\r\n&lt;/details&gt;\r\n&lt;details class=\"section\" id=\"phase-5-commit\"&gt;\r\n  &lt;summary&gt;\r\n    &lt;span class=\"section-index\"&gt;09&lt;/span&gt;\r\n    &lt;span class=\"section-title\"&gt;Phase 5 — Commit&lt;/span&gt;\r\n    &lt;span class=\"section-count\"&gt;148 words&lt;/span&gt;\r\n  &lt;/summary&gt;\r\n  &lt;div class=\"section-body\"&gt;\r\n    &lt;pre&gt;&lt;code&gt;feat(cc-otel): capture token usage + cache + stop_reason + rate limits + session linking\r\n\r\nExtend bootstrap.js fetch wrapper to read the Anthropic /v1/messages response\r\nbody on non-streaming calls and emit:\r\n  - gen_ai.usage.{input,output,cache_creation,cache_read}_input_tokens\r\n  - gen_ai.response.stop_reason\r\n  - llm.output.preview (first 500 chars)\r\n  - langfuse.observation.{model.name, usage_details} for cost auto-derive\r\n  - http.response.header.anthropic_ratelimit_* for capacity tracking\r\n  - langfuse.trace.session_id from CLAUDE_SESSION_ID or generated UUID\r\n  - source:tty|piped|cron tag from process.stdin.isTTY + CRON env\r\n\r\nStreaming responses (text/event-stream) get gen_ai.usage.captured=false with\r\ncapture_skip_reason=streaming as a fail-loud marker, to be addressed in a\r\nfollow-up phase.\r\n\r\nAdds unit tests (node --test) and a live smoke script that runs claude -p\r\nand asserts the resulting Langfuse trace carries non-zero token sums within\r\n1 hour.\r\n\r\nCloses the instrumentation gap surfaced by the 2026-05-16 activity\r\nbreakdown (0/751 traces in 24h carried any token data).&lt;/code&gt;&lt;/pre&gt;\r\n  &lt;/div&gt;\r\n&lt;/details&gt;\r\n&lt;details class=\"section\" id=\"risk-register\"&gt;\r\n  &lt;summary&gt;\r\n    &lt;span class=\"section-index\"&gt;10&lt;/span&gt;\r\n    &lt;span class=\"section-title\"&gt;Risk register&lt;/span&gt;\r\n    &lt;span class=\"section-count\"&gt;138 words&lt;/span&gt;\r\n  &lt;/summary&gt;\r\n  &lt;div class=\"section-body\"&gt;\r\n    &lt;div class=\"table-wrap\"&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Risk&lt;/th&gt;&lt;th&gt;Likelihood&lt;/th&gt;&lt;th&gt;Mitigation&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;&lt;code&gt;res.clone()&lt;/code&gt; doubles peak memory for body bytes&lt;/td&gt;&lt;td&gt;Low (responses are KB-MB)&lt;/td&gt;&lt;td&gt;Bounded by Anthropic&amp;#x27;s max response size; falls inside Node default heap&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;JSON parse fails on unexpected body shape&lt;/td&gt;&lt;td&gt;Medium for error responses&lt;/td&gt;&lt;td&gt;Try/catch → fail-loud branch; no exception escapes wrapper&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;Streaming requests inadvertently include non-streaming responses&lt;/td&gt;&lt;td&gt;Low&lt;/td&gt;&lt;td&gt;Content-type check is the canonical Anthropic SSE marker&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;&lt;code&gt;CLAUDE_SESSION_ID&lt;/code&gt; env collides with future claude-code feature&lt;/td&gt;&lt;td&gt;Low&lt;/td&gt;&lt;td&gt;Reading it is forward-compatible; if claude-code starts setting it, we adopt theirs automatically&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;Rate-limit header capture missed because header name casing varies&lt;/td&gt;&lt;td&gt;Low&lt;/td&gt;&lt;td&gt;&lt;code&gt;res.headers.get()&lt;/code&gt; is case-insensitive per fetch spec&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;Output preview leaks client conversation content&lt;/td&gt;&lt;td&gt;&lt;strong&gt;Accepted&lt;/strong&gt; per A3&lt;/td&gt;&lt;td&gt;Privacy decision frozen during intake — Langfuse Cloud is already trusted for the input preview&lt;/td&gt;&lt;/tr&gt;\r\n&lt;tr&gt;&lt;td&gt;Bootstrap.js becomes too big to read&lt;/td&gt;&lt;td&gt;Low&lt;/td&gt;&lt;td&gt;At ~240 LOC post-patch, still single-file, no extraction&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;\r\n  &lt;/div&gt;\r\n&lt;/details&gt;\r\n&lt;details class=\"section\" id=\"rollback\"&gt;\r\n  &lt;summary&gt;\r\n    &lt;span class=\"section-index\"&gt;11&lt;/span&gt;\r\n    &lt;span class=\"section-title\"&gt;Rollback&lt;/span&gt;\r\n    &lt;span class=\"section-count\"&gt;46 words&lt;/span&gt;\r\n  &lt;/summary&gt;\r\n  &lt;div class=\"section-body\"&gt;\r\n    &lt;p&gt;Single-file, single-commit change. &lt;code&gt;git revert &amp;lt;sha&amp;gt;&lt;/code&gt; restores prior behavior. Deployed copies at &lt;code&gt;~/.cc-otel/bootstrap.js&lt;/code&gt; on Windows + mini are overwritten on next rsync from the repo — manual rollback is a re-rsync of the prior commit&amp;#x27;s file. No data migration. No config changes outside the file itself.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/details&gt;\r\n&lt;details class=\"section\" id=\"follow-up-phase-out-of-scope-for-this-pr-separate-plan-when-ready\"&gt;\r\n  &lt;summary&gt;\r\n    &lt;span class=\"section-index\"&gt;12&lt;/span&gt;\r\n    &lt;span class=\"section-title\"&gt;Follow-up phase (out of scope for this PR — separate plan when ready)&lt;/span&gt;\r\n    &lt;span class=\"section-count\"&gt;118 words&lt;/span&gt;\r\n  &lt;/summary&gt;\r\n  &lt;div class=\"section-body\"&gt;\r\n    &lt;ol&gt;\r\n&lt;li&gt;&lt;strong&gt;Streaming response body parsing&lt;/strong&gt; — wrap response body as a passthrough ReadableStream; watch for &lt;code&gt;message_delta&lt;/code&gt; and &lt;code&gt;message_stop&lt;/code&gt; SSE events carrying &lt;code&gt;usage&lt;/code&gt;. ~40 LOC. Should land after this phase has 1 week of stable non-streaming data so the comparison surface is solid.&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;Tool-use child spans&lt;/strong&gt; — parse assistant &lt;code&gt;tool_use&lt;/code&gt; blocks from response body and emit synthetic OTel child spans per tool invocation. ~50 LOC.&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;Cache TTL detection&lt;/strong&gt; — inspect request body for &lt;code&gt;cache_control.ttl&lt;/code&gt; and tag with &lt;code&gt;cache_ttl:5m|1h&lt;/code&gt;. ~10 LOC. Useful for cache-ROI math.&lt;/li&gt;\r\n&lt;li&gt;&lt;strong&gt;Hermes / OpenClaw direct SDK paths&lt;/strong&gt; — for code paths that call the Anthropic SDK in-process rather than shelling out to &lt;code&gt;claude&lt;/code&gt;, wrap call sites with the Langfuse Python decorator. Separate plan, separate producer.&lt;/li&gt;\r\n&lt;/ol&gt;\r\n  &lt;/div&gt;\r\n&lt;/details&gt;\r\n&lt;details class=\"section\" id=\"execution\"&gt;\r\n  &lt;summary&gt;\r\n    &lt;span class=\"section-index\"&gt;13&lt;/span&gt;\r\n    &lt;span class=\"section-title\"&gt;Execution&lt;/span&gt;\r\n    &lt;span class=\"section-count\"&gt;43 words&lt;/span&gt;\r\n  &lt;/summary&gt;\r\n  &lt;div class=\"section-body\"&gt;\r\n    &lt;p&gt;This plan is ready to hand to a tactical-agentic-coder agent or to a Linear issue with the &lt;code&gt;automation/tac-build&lt;/code&gt; label. The phases above map 1:1 onto the tac-coder v1.2 pipeline.&lt;/p&gt;\r\n&lt;p&gt;Estimated effort: 2–3 hours including the smoke test debugging cycle.&lt;/p&gt;\r\n  &lt;/div&gt;\r\n&lt;/details&gt;\r\n    &lt;/div&gt;\r\n  &lt;/main&gt;\r\n  &lt;footer&gt;\r\n    &lt;div class=\"footer-inner\"&gt;\r\n      &lt;div class=\"footer-label\"&gt;Metadata&lt;/div&gt;\r\n      &lt;div class=\"metadata-grid\"&gt;\r\n        &lt;div class=\"meta-item\"&gt;&lt;span&gt;Source&lt;/span&gt;&lt;strong&gt;C:\\Users\\gblac\\OneDrive\\Desktop\\gbauto\\gbautomation\\second-b C PRD pipeline should optimize next.&lt;/p&gt;\r\n  &lt;/header&gt;\r\n  &lt;main&gt;\r\n    \r\n      &lt;section class=\"summary\"&gt;\r\n        &lt;div&gt;&lt;strong&gt;5&lt;/strong&gt;&lt;span&gt;sample events&lt;/span&gt;&lt;/div&gt;\r\n        &lt;div&gt;&lt;strong&gt;{&amp;#x27;dry_run_warn&amp;#x27;: 3, &amp;#x27;dry_run_fail&amp;#x27;: 2}&lt;/strong&gt;&lt;span&gt;status mix&lt;/span&gt;&lt;/div&gt;\r\n        &lt;div&gt;&lt;strong&gt;17&lt;/strong&gt;&lt;span&gt;gate findings&lt;/span&gt;&lt;/div&gt;\r\n      &lt;/section&gt;\r\n    \r\n    \r\n      &lt;section class=\"synthesis\"&gt;\r\n        &lt;h2&gt;What This Says About The Pipeline&lt;/h2&gt;\r\n        &lt;p&gt;&lt;strong&gt;2 of 5&lt;/strong&gt; samples hard-failed pre-dispatch. Both failures share the same root cause: the work is high-risk enough for team-runner, but the input is still prompt/plan shaped rather than a complete TAC PRD bundle.&lt;/p&gt;\r\n        &lt;p&gt;&lt;strong&gt;2 of 5&lt;/strong&gt; samples are missing explicit team-bundle markers. That is the clearest automation target: issue triage should upgrade high and very-high work into full TAC PRD structure before any build worker sees it.&lt;/p&gt;\r\n        &lt;p&gt;&lt;strong&gt;4 of 5&lt;/strong&gt; samples lack a `tac_validate` sidecar. That should become the mandatory bridge between PRD creation and dispatch.&lt;/p&gt;\r\n      &lt;/section&gt;\r\n    \r\n    &lt;section class=\"grid\"&gt;\r\n      \r\n          &lt;article class=\"event\"&gt;\r\n            &lt;div class=\"event-head\"&gt;\r\n              &lt;div&gt;\r\n                &lt;h2&gt;self-improve-loop-prd&lt;/h2&gt;\r\n                &lt;p&gt;github-canonical-tac-self-improve&lt;/p&gt;\r\n              &lt;/div&gt;\r\n              &lt;span class=\"status dry_run_warn\"&gt;dry_run_warn&lt;/span&gt;\r\n            &lt;/div&gt;\r\n            &lt;dl&gt;\r\n              &lt;div&gt;&lt;dt&gt;Run&lt;/dt&gt;&lt;dd&gt;tac-20260522T045753Z-2026-05-13-tac-self-improve-loop-prd&lt;/dd&gt;&lt;/div&gt;\r\n              &lt;div&gt;&lt;dt&gt;Complexity&lt;/dt&gt;&lt;dd&gt;very_high&lt;/dd&gt;&lt;/div&gt;\r\n              &lt;div&gt;&lt;dt&gt;Execution&lt;/dt&gt;&lt;dd&gt;team_runner_required&lt;/dd&gt;&lt;/div&gt;\r\n              &lt;div&gt;&lt;dt&gt;Gate pressure&lt;/dt&gt;&lt;dd&gt;2 warn/fail/pending&lt;/dd&gt;&lt;/div&gt;\r\n            &lt;/dl&gt;\r\n            &lt;section class=\"interpretation\"&gt;\r\n              &lt;p&gt;&lt;strong&gt;Diagnosis:&lt;/strong&gt; Team bundle present. Validation evidence present. Touches secrets/database/archive.&lt;/p&gt;\r\n              &lt;p&gt;&lt;strong&gt;Optimization:&lt;/strong&gt; Add missing validation/readback receipts before dispatch.&lt;/p&gt;\r\n            &lt;/section&gt;\r\n            &lt;div class=\"bar\" aria-label=\"recommendation count\"&gt;&lt;span style=\"width:33%\"&gt;&lt;/span&gt;&lt;/div&gt;\r\n            &lt;h3&gt;Gate Findings (2)&lt;/h3&gt;\r\n            &lt;ul&gt;&lt;li&gt;tighten secret-gate: status=warn; evidence=[&amp;#x27;secret surface detected&amp;#x27;]&lt;/li&gt;&lt;li&gt;tighten supabase-database-gate: status=pending; evidence=[&amp;#x27;dry run never writes Supabase/Postgres/SQLite&amp;#x27;]&lt;/li&gt;&lt;/ul&gt;\r\n          &lt;/article&gt;\r\n        \r\n          &lt;article class=\"event\"&gt;\r\n            &lt;div class=\"event-head\"&gt;\r\n              &lt;div&gt;\r\n                &lt;h2&gt;multi-tenant-build-stack&lt;/h2&gt;\r\n                &lt;p&gt;linear-autonomous-build-stack&lt;/p&gt;\r\n              &lt;/div&gt;\r\n              &lt;span class=\"status dry_run_fail\"&gt;dry_run_fail&lt;/span&gt;\r\n            &lt;/div&gt;\r\n            &lt;dl&gt;\r\n              &lt;div&gt;&lt;dt&gt;Run&lt;/dt&gt;&lt;dd&gt;tac-20260522T045754Z-2026-05-19-multi-tenant-linear-build-stack&lt;/dd&gt;&lt;/div&gt;\r\n              &lt;div&gt;&lt;dt&gt;Complexity&lt;/dt&gt;&lt;dd&gt;very_high&lt;/dd&gt;&lt;/div&gt;\r\n              &lt;div&g
