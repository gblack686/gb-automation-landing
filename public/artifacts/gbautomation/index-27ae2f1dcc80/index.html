artifacts/hermes-theme/01-landing.png", "href": "../hermes-theme/01-landing.png", "basename": "01-landing.png", "extension": ".png", "kind": "image", "category": "media", "mime": "image/png", "sizeBytes": 856624, "modifiedAt": "2026-05-21T21:25:05+00:00", "previewText": "", "scoreComponents": {"freshness": 99, "typeFit": 74, "nameSignal": 40, "substance": 88}, "baseScore": 75}, {"id": "artifacts/hermes-theme/02-config.png", "path": "artifacts/hermes-theme/02-config.png", "href": "../hermes-theme/02-config.png", "basename": "02-config.png", "extension": ".png", "kind": "image", "category": "media", "mime": "image/png", "sizeBytes": 904312, "modifiedAt": "2026-05-21T21:25:08+00:00", "previewText": "", "scoreComponents": {"freshness": 99, "typeFit": 74, "nameSignal": 40, "substance": 88}, "baseScore": 75}, {"id": "artifacts/hermes-theme/03-models.png", "path": "artifacts/hermes-theme/03-models.png", "href": "../hermes-theme/03-models.png", "basename": "03-models.png", "extension": ".png", "kind": "image", "category": "media", "mime": "image/png", "sizeBytes": 893545, "modifiedAt": "2026-05-21T21:25:11+00:00", "previewText": "", "scoreComponents": {"freshness": 99, "typeFit": 74, "nameSignal": 40, "substance": 88}, "baseScore": 75}, {"id": "artifacts/hermes-theme/04-theme-or-settings.png", "path": "artifacts/hermes-theme/04-theme-or-settings.png", "href": "../hermes-theme/04-theme-or-settings.png", "basename": "04-theme-or-settings.png", "extension": ".png", "kind": "image", "category": "media", "mime": "image/png", "sizeBytes": 906148, "modifiedAt": "2026-05-21T21:25:13+00:00", "previewText": "", "scoreComponents": {"freshness": 99, "typeFit": 74, "nameSignal": 40, "substance": 88}, "baseScore": 75}, {"id": "artifacts/plan-renders/2026-05-16-cc-otel-token-instrumentation/2026-05-16-cc-otel-token-instrumentation.md", "path": "artifacts/plan-renders/2026-05-16-cc-otel-token-instrumentation/2026-05-16-cc-otel-token-instrumentation.md", "href": "../plan-renders/2026-05-16-cc-otel-token-instrumentation/2026-05-16-cc-otel-token-instrumentation.md", "basename": "2026-05-16-cc-otel-token-instrumentation.md", "extension": ".md", "kind": "markdown", "category": "plan", "mime": "text/markdown", "sizeBytes": 22286, "modifiedAt": "2026-05-16T22:24:36+00:00", "previewText": "---\nkind: plan\ntype: tac-build-plan\nstatus: ready-to-execute\ndate: 2026-05-16\ncreated: 2026-05-16\ndescription: \"Teach cc-otel bootstrap.js to read Anthropic /v1/messages response bodies and emit token usage, cache-token counts, stop_reason, output preview, rate-limit headers, source tag, and Langfuse session id — closing the 0/751-traces token-data gap surfaced 2026-05-16.\"\npriority: high\ndomain: observability\nauthor: greg-claude\nrelated:\n  - \"[[cc-otel]]\"\n  - \"[[langfuse]]\"\n  - \"[[mac-mini-services-smoke]]\"\n  - \"[[check-langfuse-logs]]\"\n  - \"[[2026-04-29-tac-kb-local-only]]\"\n  - \"[[reference_claude_subprocess_pattern]]\"\ntags:\n  - plan\n  - tac\n  - observability\n  - langfuse\n  - cc-otel\n  - tactic/7-observability\nclient: gbautomation\n---\n\n# Plan: Capture token usage + 4 adjacent dimensions in cc-otel bootstrap.js\n\n&gt; Generated via tac-coder v1.2 (Phase 0 intake → Phase 1 ground → this plan).\n&gt; Cause: 2026-05-16 Langfuse activity-breakdown showed 0/751 traces in last 24h carry token usage or cost.\n&gt; Companion incident report: `second-brain/intelligence/observability/langfuse/2026-05-16-activity-breakdown.md`.\n\n## Context\n\n`resources/cc-otel/bootstrap.js` monkey-patches `globalThis.fetch` inside every Node-based agent invocation that loads it via `NODE_OPTIONS=--require=…/bootstrap.js`. This includes interactive claude-code on Windows + Mac, the Linear cron coding agent on the mini, and any Hermes/OpenClaw call that shells out to a claude subprocess. **One bootstrap, many producers.**\n\nThe hook currently captures HTTP-level facts (`http.url`, `http.method`, `http.route`, `http.status_code`, `http.duration_ms`, `llm.request.model`, `llm.input.preview`, plus `cc.repo`, `cc.branch`, `cc.cwd`) and ends the span the instant response headers arrive. It never reads the response body. Anthropic's `/v1/messages` response always carries a `usage` block (`input_tokens`, `output_tokens`, `cache_creation_input_tokens`, `cache_read_input_tokens`) plus a `stop_reason`. None of it lands in Langfuse.\n\nThis phase teaches the hook to read the response body for non-streaming requests, extract the usage block + stop reason + response headers + first 500 chars of output text, and emit them as OTel attributes that Langfuse Cloud auto-derives cost from.\n\n## Scope\n\n### In scope (one PR, one rollout cycle)\n\n1. **Token usage** — `input_tokens` / `output_tokens` from response body\n2. **Prompt-cache tokens** — `cache_creation_input_tokens` / `cache_read_input_tokens` from response body\n3. **`stop_reason`** — from response body\n4. **Output preview** — first 500 chars of first text block, no redaction (per intake Q3)\n5. **Rate-limit headers** — `anthropic-ratelimit-{requests,tokens}-{limit,remaining,reset}` from response headers\n6. **Trace session linking** — `CLAUDE_SESSION_ID` env or process-uuid fallback → Langfuse session_id\n7. **Invocation source** — `source:tty | piped | cron` tag derived at bootstrap start\n8. **Streaming fail-loud** — detect SSE responses and emit `gen_ai.usage.captured=false reason=streaming` instead of silent zero\n9. **Smoke test** — `resources/cc-otel/scripts/smoke-token-capture.sh` runs `claude -p` + waits + reads back from Langfuse via existing `langfuse_activity_breakdown.py` and asserts `Sum output tokens &gt; 0` from the last hour\n10. **Unit test** — `resources/cc-otel/bootstrap.test.js` with stubbed fetch covering: non-streaming JSON response with usage, streaming response (fail-loud branch), non-Anthropic URL (untouched passthrough), and the source/session tag wiring\n\n### Out of scope (explicit non-goals)\n\n- **Streaming response body parsing** — deferred. SSE wrap is its own ~40 LOC; we land the non-streaming win first, validate against Anthropic billing for a known day, then do streaming as a follow-up (see \"Follow-up phase\" below).\n- **Tool-use child spans** — assistant `tool_use` blocks are not parsed into separate observations in this phase.\n- **LLM-as-judge `scores` push** — separate cron, separate skill; tracked in `second-brain/tasks/feedback-loops/L18-nightly-langfuse-dream-review.md`.\n- **File-extension / per-file token attribution** — requires tool_use parsing first.\n- **Tier-3-only trace-linking deeper than session_id** — no parent/child span linking across separate claude-code invocations.\n- **Hermes / OpenClaw direct SDK paths** — covered automatically when they shell out to `claude`; not covered when they call Anthropic SDK directly. A separate Hermes-side wrapper phase handles those.\n\n### Boundary contract\n\nThis phase touches **only** `resources/cc-otel/`. No edits to Hermes, OpenClaw, Langfuse, the Linear cron, or any plist. After deploy, the existing 514 mac-mini claude-code traces and the existing 29 Hermes-via-subprocess traces start carrying usage; everything else is unchanged.\n\n## Assumptions (locked during Phase 0 intake)\n\n| ID | Assumption | Source |\n|---|---|---|\n| A1 | Scope is Tiers 1–5 in one phase | Intake Q1 |\n| A2 | Streaming responses are deferred; fail-loud marker on streaming spans | Intake Q2 |\n| A3 | Output preview captured as 500-char truncation, no redaction | Intake Q3 |\n| A4 | Smoke test is live `claude -p` + `langfuse_activity_breakdown.py --hours 1` asserting `Sum output &gt; 0` | Intake Q4 |\n| A5 | Anchor on OTel GenAI semantic conventions (`gen_ai.usage.input_tokens`, `gen_ai.usage.output_tokens`, `gen_ai.response.stop_reason`) plus Langfuse-specific `langfuse.observation.usage_details` JSON for auto-cost-derivation | Default — Langfuse OTel mapping is published, no other anchor proposed |\n| A6 | `claude -p` invocations are non-streaming by default (the `--stream` flag exists but is opt-in). Most existing 514 mac-mini traces will be covered by the non-streaming path | Source: `claude --help` |\n| A7 | Anthropic prompt-cache `cache_control` TTL (5m vs 1h) is on the REQUEST body, not the RESPONSE — we don't capture this in this phase; deferred to optional follow-up | Source: Anthropic API docs |\n| A8 | `CLAUDE_SESSION_ID` env may not be set by claude-code today. Fallback: generate one UUID per bootstrap load with `crypto.randomUUID()`. Process-scoped, not per-turn | Defensive default |\n\n## Phase 1 — Ground (TAC scan results)\n\n| Source | Hit | Reuse? |\n|---|---|---|\n| `second-brain/knowledge/tac-kb.md` (compiled 30-source bundle) | No prior `cc-otel`/`bootstrap.js`/`gen_ai.usage`/Anthropic-fetch-wrapper component | TAC-no-match — documented |\n| `~/repos/the-library/library.yaml` (Mac-mini side, per tac-coder Phase 1 step 1) | _execution: skip — current cc-otel bootstrap is itself the prior art; we're extending it, not reinventing_ | Extend |\n| `resources/cc-otel/bootstrap.js` | This phase's edit target — preserves OTel setup, exporter wiring, repo-detection, tag composition | Extend |\n| `resources/lib/tracing.py` | Python-side tracing helper; out of scope here (no Python edits) | N/A |\n| `scripts/setup_codex_langfuse.py` | Sets `LANGFUSE_OTEL_*` envs for codex; unrelated to bootstrap.js content | N/A |\n| Langfuse OTel docs (https://langfuse.com/docs/integrations/opentelemetry/example-otel) | Reference architecture — `langfuse.observation.usage_details` JSON attr maps directly to cost catalog | Anchor |\n| OpenInference GenAI semconv (https://github.com/Arize-ai/openinference/blob/main/spec/semantic_conventions.md) | `gen_ai.usage.input_tokens` / `gen_ai.usage.output_tokens` / `gen_ai.response.stop_reason` — standard attribute names | Anchor |\n\nTAC reuse policy ([[feedback_tac_first_reuse_policy]]) satisfied: extending an existing component, no new agent / skill / hook / command / ADW. KB-no-match on the specific patch documented.\n\n## Phase 2 — Plan (file-by-file)\n\n| File | Action | Net LOC |\n|---|---|---|\n| `resources/cc-otel/bootstrap.js` | Extend the `patchedFetch` wrapper inside the `globalThis.fetch` monkey-patch to: (i) detect streaming vs non-streaming via response `content-type`, (ii) for non-streaming, clone the response, parse JSON body, extract usage/stop_reason/first-text-block, (iii) for streaming, set fail-loud attrs, (iv) capture rate-limit headers from response headers, (v) add `source:` tag derived at module load, (vi) add session_id resolved from `CLAUDE_SESSION_ID` or generated UUID. | +~80 |\n| `resources/cc-otel/bootstrap.test.js` | New file. Node native test runner (`node --test`). Four test cases per the In-Scope #10 enumeration. No network — fetch is stubbed. | +~120 |\n| `resources/cc-otel/scripts/smoke-token-capture.sh` | New file. Runs `claude -p \"say hi\"` on host with cc-otel loaded, sleeps 60s for OTel batch flush, then invokes `python resources/skills/check-langfuse-logs/scripts/langfuse_activity_breakdown.py --hours 1` and greps the output for `Sum input/output/total tokens` — fails if all three are 0. | +~25 |\n| `resources/cc-otel/README.md` | Document the new attributes table (attribute name → source → Langfuse mapping) so future maintainers know the contract. | +~40 |\n| `resources/cc-otel/package.json` | No change — only stdlib modules used (`crypto.randomUUID`, existing `@opentelemetry/*` already present). | 0 |\n| Deploy targets | After merge: rsync `bootstrap.js` to `~/.cc-otel/bootstrap.js` on the Windows dev box AND on the Mac mini (per existing convention — both hosts already reference this path in their `NODE_OPTIONS`). Rsync step lives in the smoke-test runbook, not in this code. | 0 |\n\n### Attribute contract (new attrs emitted on each Anthropic `/v1/messages` span)\n\n| OTel attribute | Source | Notes |\n|---|---|---|\n| `gen_ai.usage.input_tokens` | `body.usage.input_tokens` | |\n| `gen_ai.usage.output_tokens` | `body.usage.output_tokens` | |\n| `gen_ai.usage.cache_creation_input_tokens` | `body.usage.cache_creation_input_tokens` | Anthropic-specific extension |\n| `gen_ai.usage.cache_read_input_tokens` | `body.usage.cache_read_input_tokens` | Anthropic-specific extension |\n| `gen_ai.response.stop_reason` | `body.stop_reason` | `end_turn` / `max_tokens` / `tool_use` / `stop_sequence` |\n| `gen_ai.usage.captured` | `true` for non-streaming, `false` for streaming | Fail-loud marker |\n| `gen_ai.usage.capture_skip_reason` | `streaming` when applicable | Diagnostic |\n| `llm.output.preview` | First 500 chars of first `body.content[].text` block | Matches existing `llm.input.preview` pattern |\n| `langfuse.observation.usage_details` | JSON-stringified `{\"input\":N,\"output\":N,\"cache_creation\":N,\"cache_read\":N}` | Triggers Langfuse cost auto-derivation |\n| `langfuse.observation.model.name` | Resolved model name (same as `llm.request.model`) | Required for Langfuse cost catalog lookup |\n| `langfuse.trace.session_id` | `process.env.CLAUDE_SESSION_ID` or generated per-process UUID | Rolls multi-fetch turns into one Langfuse session |\n| `http.response.header.anthropic_ratelimit_requests_limit` | response header | |\n| `http.response.header.anthropic_ratelimit_requests_remaining` | response header | |\n| `http.response.header.anthropic_ratelimit_tokens_limit` | response header | |\n| `http.response.header.anthropic_ratelimit_tokens_remaining` | response header | |\n| `http.response.header.anthropic_ratelimit_tokens_reset` | response header | ISO timestamp |\n| (existing tag list) `source:tty\\|piped\\|cron` | derived at bootstrap load | `tty` if `process.stdin.isTTY`, `cron` if `CRON \\|\\| GITHUB_ACTIONS \\|\\| CLAUDE_CODE_NONINTERACTIVE`, else `piped` |\n\n## Phase 3 — Build (implementation notes)\n\n1. **Module-load-time additions** (above the existing `globalThis.fetch` patch):\n\n   ```js\n   const { randomUUID } = require('crypto');\n   const _sessionId = process.e <script>
const artifacts = JSON.parse(document.getElementById("artifact-data").textContent);
const reviewKey = "gbauto.artifactViewer.review.v1";
const actionWeights = { archive: -30, promote: 18, template: 14 };
let review = JSON.parse(localStorage.getItem(reviewKey) || "{}");
let selectedId = artifacts[0]?.id || null;

const listEl = document.getElementById("list");
const searchEl = document.getElementById("search");
const kindFilter = document.getElementById("kindFilter");
const actionFilter = document.getElementById("actionFilter");

function saveReview() {
  localStorage.setItem(reviewKey, JSON.stringify(review));
}

function stateFor(id) {
  return review[id] || {};
}

function adjustedScore(item) {
  const st = stateFor(item.id);
  let score = item.baseScore;
  if (st.archive) score += actionWeights.archive;
  if (st.promote) score += actionWeights.promote;
  if (st.template) score += actionWeights.template;
  return Math.max(0, Math.min(100, Math.round(score)));
}

function formatBytes(bytes) {
  if (!bytes) return "0 B";
  const units = ["B", "KB", "MB", "GB"];
  let n = bytes;
  let idx = 0;
  while (n >= 1024 && idx < units.length - 1) { n /= 1024; idx += 1; }
  return `${n.toFixed(idx ? 1 : 0)} ${units[idx]}`;
}

function formatDate(value) {
  return new Date(value).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

function passesAction(item, mode) {
  const st = stateFor(item.id);
  if (mode === "all") return true;
  if (mode === "unreviewed") return !st.archive && !st.promote && !st.template;
  return Boolean(st[mode]);
}

function filteredItems() {
  const q = searchEl.value.trim().toLowerCase();
  const kind = kindFilter.value;
  const action = actionFilter.value;
  return artifacts
    .filter(item => kind === "all" || item.kind === kind)
    .filter(item => passesAction(item, action))
    .filter(item => !q || `${item.path} ${item.category} ${item.kind}`.toLowerCase().includes(q))
    .sort((a, b) => adjustedScore(b) - adjustedScore(a) || a.path.localeCompare(b.path));
}

function renderKindFilter() {
  const kinds = Array.from(new Set(artifacts.map(item => item.kind))).sort();
  kindFilter.innerHTML = `<option value="all">All document types</option>` +
    kinds.map(kind => `<option value="${kind}">${kind}</option>`).join("");
}

function renderSummary(items) {
  document.getElementById("totalCount").textContent = items.length;
  document.getElementById("promoteCount").textContent = Object.values(review).filter(st => st.promote).length;
  document.getElementById("templateCount").textContent = Object.values(review).filter(st => st.template).length;
  document.getElementById("archiveCount").textContent = Object.values(review).filter(st => st.archive).length;
}

function renderList() {
  const items = filteredItems();
  renderSummary(items);
  if (!items.length) {
    listEl.innerHTML = `<div class="empty">No artifacts match the current filters.</div>`;
    return;
  }
  if (!items.some(item => item.id === selectedId)) selectedId = items[0].id;
  listEl.innerHTML = items.map(item => {
    const st = stateFor(item.id);
    const chips = [
      item.kind,
      item.category,
      st.archive ? "archive" : "",
      st.promote ? "promote" : "",
      st.template ? "template" : "",
    ].filter(Boolean).map(chip => `<span class="chip">${escapeHtml(chip)}</span>`).join("");
    return `<button class="row ${item.id === selectedId ? "active" : ""}" data-id="${escapeHtml(item.id)}">
      <div>
        <div class="row-title">${escapeHtml(item.basename)}</div>
        <div class="row-path">${escapeHtml(item.path)}</div>
        <div class="chips">${chips}</div>
      </div>
      <div class="score-pill">${adjustedScore(item)}</div>
    </button>`;
  }).join("");
  listEl.querySelectorAll(".row").forEach(row => {
    row.addEventListener("click", () => {
      selectedId = row.dataset.id;
      render();
    });
  });
}

function renderBars(item) {
  const rows = [
    ["Freshness", item.scoreComponents.freshness, "Modified recency"],
    ["Type fit", item.scoreComponents.typeFit, "Preview/reuse potential"],
    ["Name signal", item.scoreComponents.nameSignal, "Filename intent"],
    ["Substance", item.scoreComponents.substance, "Useful file weight"],
  ];
  const st = stateFor(item.id);
  const action = (st.archive ? -30 : 0) + (st.promote ? 18 : 0) + (st.template ? 14 : 0);
  document.getElementById("bars").innerHTML = rows.map(([label, value, title]) => `
    <div class="bar" title="${escapeHtml(title)}">
      <span>${label}</span>
      <div class="track"><div class="fill" style="width:${value}%"></div></div>
      <b>${value}</b>
    </div>`).join("") + `
    <div class="bar" title="Review action adjustment">
      <span>Review</span>
      <div class="track"><div class="fill" style="width:${Math.max(0, Math.min(100, 50 + action))}%"></div></div>
      <b>${action >= 0 ? "+" : ""}${action}</b>
    </div>`;
}

function renderPreview(item) {
  document.getElementById("selectedScore").textContent = adjustedScore(item);
  document.getElementById("previewTitle").textContent = item.basename;
  document.getElementById("previewSub").textContent = item.path;
  document.getElementById("openLink").href = item.href;
  document.getElementById("docMeta").innerHTML = [
    item.kind,
    item.mime,
    item.extension,
    formatBytes(item.sizeBytes),
    formatDate(item.modifiedAt),
  ].map(value => `<span class="chip">${escapeHtml(value)}</span>`).join("");
  renderBars(item);

  const stage = document.getElementById("stage");
  if (item.kind === "image") {
    stage.innerHTML = `<img src="${escapeHtml(item.href)}" alt="">`;
  } else if (item.kind === "video") {
    stage.innerHTML = `<video src="${escapeHtml(item.href)}" controls></video>`;
  } else if (item.kind === "audio") {
    stage.innerHTML = `<div class="audio-wrap"><audio src="${escapeHtml(item.href)}" controls></audio></div>`;
  } else if (item.kind === "pdf" || item.kind === "html") {
    stage.innerHTML = `<iframe src="${escapeHtml(item.href)}" title="${escapeHtml(item.basename)}"></iframe>`;
  } else if (["text", "markdown", "json"].includes(item.kind)) {
    stage.innerHTML = `<pre>${escapeHtml(item.previewText || "No text preview was captured.")}</pre>`;
  } else {
    stage.innerHTML = `<div class="fallback"><strong>Preview unavailable for this document type</strong>
      <p>This file is indexed and reviewable. Use Open for native preview/download, then mark it for archive, promotion, or template reuse.</p>
      <p><code>${escapeHtml(item.mime)}</code></p></div>`;
  }

  for (const [id, key] of [["archiveBtn", "archive"], ["promoteBtn", "promote"], ["templateBtn", "template"]]) {
    document.getElementById(id).classList.toggle("active", Boolean(stateFor(item.id)[key]));
  }
}

function toggleAction(key) {
  if (!selectedId) return;
  const current = stateFor(selectedId);
  current[key] = !current[key];
  review[selectedId] = current;
  saveReview();
  render();
}

function render() {
  renderList();
  const item = artifacts.find(row => row.id === selectedId);
  if (item) renderPreview(item);
}

document.getElementById("archiveBtn").addEventListener("click", () => toggleAction("archive"));
document.getElementById("promoteBtn").addEventListener("click", () => toggleAction("promote"));
document.getElementById("templateBtn").addEventListener("click", () => toggleAction("template"));
searchEl.addEventListener("input", render);
kindFilter.addEventListener("change", render);
actionFilter.addEventListener("change", render);

renderKindFilter();
render();
</script>
