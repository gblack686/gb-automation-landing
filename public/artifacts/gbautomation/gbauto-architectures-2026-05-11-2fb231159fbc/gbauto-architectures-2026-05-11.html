<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body {
        width:1280px; height:720px; overflow:hidden;
        background:#F3F1E7;
        font-family:'Inter', system-ui, sans-serif;
        color:#191919;
      }
      .clip { position:absolute; }

      /* GB swirl intro — absolute-positioned, no CSS transform (GSAP will own the transform) */
      #swirl {
        left:340px; top:60px;
        width:600px; height:600px;
        opacity:0.92;
      }
      #swirl img { width:100%; height:100%; object-fit:contain; }

      /* Fullbleed Ken Burns photos */
      .photo-stage {
        left:0; top:0;
        width:1280px; height:720px;
        overflow:hidden;
      }
      .photo {
        position:absolute;
        left:0; top:0;
        width:1280px; height:720px;
        object-fit:cover;
        will-change: transform;
      }
      .photo-stage::after {
        content:'';
        position:absolute; inset:0;
        background: linear-gradient(180deg, rgba(0,0,0,0) 50%, rgba(25,24,25,0.55) 100%);
        pointer-events:none;
      }
      .label {
        position:absolute;
        bottom:72px;
        left:64px;
        z-index:5;
        font-size:22px;
        font-weight:600;
        letter-spacing:5px;
        color:#F3F1E7;
        background:rgba(217,119,87,0.92);
        padding:10px 22px;
        border-radius:3px;
        text-transform:uppercase;
      }
      .label .num {
        color:#191919;
        font-weight:800;
        margin-right:10px;
        opacity:0.85;
      }

      /* End grid */
      .grid-cell {
        overflow:hidden;
        border-radius:6px;
        box-shadow: 0 12px 28px rgba(25,24,25,0.20);
      }
      .grid-cell img { width:100%; height:100%; object-fit:cover; display:block; }

      #title-final {
        top:140px;
        left:0; right:0;
        text-align:center;
        font-family:'Newsreader', Georgia, serif;
        font-style:italic;
        font-size:86px;
        font-weight:500;
        color:#191919;
        letter-spacing:-3px;
        line-height:1.05;
      }
      #title-final .accent { color:#D97757; }
      #title-sub {
        top:260px;
        left:0; right:0;
        text-align:center;
        font-size:20px;
        font-weight:500;
        letter-spacing:6px;
        color:#8C8A84;
        text-transform:uppercase;
      }

      #cta-final {
        bottom:70px;
        left:0; right:0;
        text-align:center;
      }
      .pill {
        display:inline-block;
        padding:14px 38px;
        background:#191919;
        color:#F3F1E7;
        border-radius:999px;
        font-size:17px;
        font-weight:600;
        letter-spacing:3px;
        text-transform:uppercase;
      }
      .pill .arrow { margin-left:10px; color:#D97757; font-weight:700; }
    </style>
  </head>
  <body>
    <div id="root"
         data-composition-id="main"
         data-start="0"
         data-duration="12"
         data-width="1280"
         data-height="720">

      <!-- GB swirl intro -->
      <div id="swirl" class="clip" data-start="0" data-duration="2.5" data-track-index="0">
        <img src="./assets/gb-signature.png" alt="GB" />
      </div>

      <!-- Image 1: CC-HARNESS-04 (Pepper robot face) -->
      <div id="img1" class="clip photo-stage" data-start="1.0" data-duration="3.5" data-track-index="1">
        <img class="photo" src="./assets/photo-1485827404703-89b55fcc595e.jpg" alt="" />
        <div class="label"><span class="num">01</span>CC-HARNESS-04</div>
      </div>

      <!-- Image 2: DEV-CDK-02 (robot hand) -->
      <div id="img2" class="clip photo-stage" data-start="3.5" data-duration="2.5" data-track-index="2">
        <img class="photo" src="./assets/photo-1531746790731-6c087fecd65a.jpg" alt="" />
        <div class="label"><span class="num">02</span>DEV-CDK-02</div>
      </div>

      <!-- Image 3: AWS-OPS-01 (tin robot) -->
      <div id="img3" class="clip photo-stage" data-start="5.5" data-duration="2.5" data-track-index="3">
        <img class="photo" src="./assets/photo-1546776310-eef45dd6d63c.jpg" alt="" />
        <div class="label"><span class="num">03</span>AWS-OPS-01</div>
      </div>

      <!-- Image 4: ORCH-NEO4J-05 (humanoid on bench) -->
      <div id="img4" class="clip photo-stage" data-start="7.5" data-duration="2.5" data-track-index="4">
        <img class="photo" src="./assets/photo-1620712943543-bcc4688e7485.jpg" alt="" />
        <div class="label"><span class="num">04</span>ORCH-NEO4J-05</div>
      </div>

      <!-- Final 4-up grid -->
      <div id="grid1" class="grid-cell clip" data-start="9.0" data-duration="3" data-track-index="5"
           style="top:380px; left:170px; width:210px; height:130px;">
        <img src="./assets/photo-1485827404703-89b55fcc595e.jpg" />
      </div>
      <div id="grid2" class="grid-cell clip" data-start="9.0" data-duration="3" data-track-index="6"
           style="top:380px; left:400px; width:210px; height:130px;">
        <img src="./assets/photo-1531746790731-6c087fecd65a.jpg" />
      </div>
      <div id="grid3" class="grid-cell clip" data-start="9.0" data-duration="3" data-track-index="7"
           style="top:380px; left:630px; width:210px; height:130px;">
        <img src="./assets/photo-1546776310-eef45dd6d63c.jpg" />
      </div>
      <div id="grid4" class="grid-cell clip" data-start="9.0" data-duration="3" data-track-index="8"
           style="top:380px; left:860px; width:210px; height:130px;">
        <img src="./assets/photo-1620712943543-bcc4688e7485.jpg" />
      </div>

      <div id="title-final" class="clip" data-start="9.0" data-duration="3" data-track-index="9">
        Deployed <span class="accent">Architectures</span>
      </div>
      <div id="title-sub" class="clip" data-start="9.5" data-duration="2.5" data-track-index="10">
        Four shipped &middot; More in flight
      </div>

      <div id="cta-final" class="clip" data-start="10.4" data-duration="1.6" data-track-index="11">
        <span class="pill">gbautomation.xyz<span class="arrow">&nbsp;&rarr;</span></span>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // -------- 0.0s -> 1.5s : GB swirl intro
      tl.fromTo("#swirl",
        { opacity: 0, scale: 0.45, rotation: -25 },
        { opacity: 0.92, scale: 1.0, rotation: 0, duration: 0.95, ease: "power3.out" }, 0.05);
      tl.to("#swirl",
        { opacity: 0, scale: 1.1, duration: 0.45, ease: "power1.in" }, 1.45);

      // -------- 1.2s -> 4.4s : Image 1, Ken Burns slow zoom-in + drift left
      tl.fromTo("#img1",
        { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power2.out" }, 1.2);
      tl.fromTo("#img1 .photo",
        { scale: 1.0, x: 0, y: 0 },
        { scale: 1.16, x: -45, y: -18, duration: 3.2, ease: "none" }, 1.2);
      tl.fromTo("#img1 .label",
        { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.8);
      tl.to("#img1", { opacity: 0, duration: 0.4, ease: "power1.in" }, 4.0);

      // -------- 3.7s -> 5.9s : Image 2, drift zoom-out + pan right
      tl.fromTo("#img2",
        { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 3.7);
      tl.fromTo("#img2 .photo",
        { scale: 1.12, x: 0, y: 0 },
        { scale: 1.0, x: 35, y: 10, duration: 2.2, ease: "none" }, 3.7);
      tl.fromTo("#img2 .label",
        { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 4.2);
      tl.to("#img2", { opacity: 0, duration: 0.4, ease: "power1.in" }, 5.5);

      // -------- 5.7s -> 7.9s : Image 3, zoom-in + pan diagonal
      tl.fromTo("#img3",
        { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 5.7);
      tl.fromTo("#img3 .photo",
        { scale: 1.0, x: 0, y: 0 },
        { scale: 1.2, x: 22, y: 34, duration: 2.2, ease: "none" }, 5.7);
      tl.fromTo("#img3 .label",
        { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 6.2);
      tl.to("#img3", { opacity: 0, duration: 0.4, ease: "power1.in" }, 7.5);

      // -------- 7.7s -> 9.5s : Image 4, settle (start zoomed, drift to neutral)
      tl.fromTo("#img4",
        { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 7.7);
      tl.fromTo("#img4 .photo",
        { scale: 1.18, x: 0, y: -32 },
        { scale: 1.02, x: -22, y: 0, duration: 2.0, ease: "none" }, 7.7);
      tl.fromTo("#img4 .label",
        { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 8.2);
      tl.to("#img4", { opacity: 0, duration: 0.5, ease: "power1.in" }, 9.0);

      // -------- 9.0s -> 12.0s : Final grid + title + CTA
      tl.from("#title-final", { opacity: 0, y: -30, duration: 0.8, ease: "power3.out" }, 9.1);
      tl.from("#title-sub",   { opacity: 0, y: -10, duration: 0.6, ease: "power2.out" }, 9.6);

      tl.from("#grid1", { opacity: 0, y: 70, duration: 0.55, ease: "power3.out" }, 9.3);
      tl.from("#grid2", { opacity: 0, y: 70, duration: 0.55, ease: "power3.out" }, 9.4);
      tl.from("#grid3", { opacity: 0, y: 70, duration: 0.55, ease: "power3.out" }, 9.5);
      tl.from("#grid4", { opacity: 0, y: 70, duration: 0.55, ease: "power3.out" }, 9.6);

      tl.from("#cta-final", { opacity: 0, scale: 0.88, duration: 0.55, ease: "back.out(1.5)" }, 10.4);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
