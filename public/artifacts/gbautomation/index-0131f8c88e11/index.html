<script>
const runs = JSON.parse(document.getElementById("run-data").textContent);
const reviewKey = "gbauto.skillRunsViewer.review.v1";
let review = JSON.parse(localStorage.getItem(reviewKey) || "{}");
let selectedId = runs[0]?.id || null;
const searchEl = document.getElementById("search");
const skillFilter = document.getElementById("skillFilter");
const stateFilter = document.getElementById("stateFilter");
function saveReview(){ localStorage.setItem(reviewKey, JSON.stringify(review)); }
function st(id){ return review[id] || {}; }
function esc(v){ return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDate(v){ return new Date(v).toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"}); }
function latestIds(){ const map = new Map(); for (const run of runs){ if(!map.has(run.skill)) map.set(run.skill, run.id); } return new Set(map.values()); }
function scorePart(run, kind){ const s=run.summary||{}; const total=Math.max(1,s.total||0); const artifacts=(run.artifacts||[]).length; if(kind==="completion") return Math.round(((s.ok||0)+(s.mocked||0)*.55)/total*100); if(kind==="evidence") return Math.min(100,artifacts*16); if(kind==="speed") return run.durationSec<=60?100:Math.max(0,Math.round(100-Math.min(100,(run.durationSec-60)/3))); return run.status==="ok"?100:Math.max(0,50-(s.errors||0)*25); }
function filtered(){ const q=searchEl.value.trim().toLowerCase(); const skill=skillFilter.value; const mode=stateFilter.value; const latest=latestIds(); return runs.filter(r=>skill==="all"||r.skill===skill).filter(r=>{const rs=st(r.id); if(mode==="latest") return latest.has(r.id)||rs.latest; if(mode==="saved") return rs.saved; if(mode==="approved") return rs.approved; if(mode==="unreviewed") return !rs.saved&&!rs.approved; return true;}).filter(r=>!q||`${r.skill} ${r.runId} ${r.status} ${r.jsonPath} ${(r.artifacts||[]).join(" ")}`.toLowerCase().includes(q)); }

function renderList(){ const items=filtered(); renderSummary(items); if(!items.length){document.getElementById("list").innerHTML='<div class="empty">No runs match the current filters.</div>'; return;} if(!items.some(r=>r.id===selectedId)) selectedId=items[0].id; document.getElementById("list").innerHTML=items.map(r=>{const rs=st(r.id); const chips=[r.status,`${r.summary?.total||0} steps`,`${(r.artifacts||[]).length} artifacts`,rs.saved?"saved":"",rs.approved?"approved":""].filter(Boolean).map(c=>`<span class="chip">${esc(c)}</span>`).join(""); return `<button class="row ${r.id===selectedId?"active":""}" data-id="${esc(r.id)}"><div><div class="title">${esc(r.skill)} · ${esc(r.runId)}</div><div class="sub">${esc(r.jsonPath)}</div><div class="chips">${chips}</div></div><div class="score">${r.score}</div></button>`}).join(""); document.querySelectorAll(".row").forEach(el=>el.addEventListener("click",()=>{selectedId=el.dataset.id; render();})); }
function renderBars(run){ const rows=[["Completion",scorePart(run,"completion")],["Evidence",scorePart(run,"evidence")],["Speed",scorePart(run,"speed")],["Reliability",scorePart(run,"reliability")]]; document.getElementById("bars").innerHTML=rows.map(([label,val])=>`<div class="bar"><span>${label}</span><div class="track"><div class="fill" style="width:${val}%"></div></div><b>${val}</b></div>`).join(""); }
function renderRun(run){ const rs=st(run.id); document.getElementById("score").textContent=run.score; document.getElementById("runTitle").textContent=`${run.skill} · ${run.runId}`; document.getElementById("runSub").textContent=run.jsonPath; document.getElementById("runMeta").innerHTML=[run.status,fmtDate(run.started),`${run.durationSec ?? 0}s`,`${run.artifacts.length} artifacts`].map(x=>`<span class="chip">${esc(x)}</span>`).join(""); document.getElementById("openJson").href=run.jsonHref; document.getElementById("openMd").href=run.mdHref||run.jsonHref; document.getElementById("latestBtn").classList.toggle("active",latestIds().has(run.id)||rs.latest); document.getElementById("savedBtn").classList.toggle("active",!!rs.saved); document.getElementById("approvedBtn").classList.toggle("active",!!rs.approved); renderBars(run); document.getElementById("steps").innerHTML=`<table><thead><tr><th>#</th><th>Step</th><th>Status</th><th>Artifacts</th></tr></thead><tbody>${(run.steps||[]).map(step=>`<tr><td>${step.num}</td><td>${esc(step.name)}<div class="sub">${esc((step.notes||[]).join(" "))}</div></td><td>${esc(step.status)}<div class="sub">${esc(step.mode)} · ${esc(step.duration_sec)}s</div></td><td>${(step.artifacts||[]).map(a=>`<div class="sub">${esc(a)}</div>`).join("")}</td></tr>`).join("")}</tbody></table>`; document.getElementById("preview").textContent=run.markdownPreview || JSON.stringify(run,null,2); }

document.getElementById("approvedBtn").addEventListener("click",()=>toggle("approved"));
