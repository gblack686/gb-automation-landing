<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" font-family="'Inter','Segoe UI',Helvetica,Arial,sans-serif">
<title>GBAutomation TAC build workflow DAG</title>
<desc>Animated directed acyclic graph showing the TAC build workflow from input through retrieval, build, validation, observability, reports, and team handoff.</desc>
