    <style>
      /* Customize ElevenLabs widget to match landing page */
      elevenlabs-convai {
        bottom: 120px !important;
        right: 50% !important;
        transform: translateX(50%) !important;
        --el-avatar-size: 120px !important;
        --el-primary-color: #00DCFF !important;
        --el-background-color: transparent !important;
        --el-text-color: #ffffff !important;
      }

      /* Make the orb much larger and add glow effect */
      elevenlabs-convai::part(avatar) {
        width: 120px !important;
        height: 120px !important;
        box-shadow: 0 0 40px rgba(0, 220, 255, 0.6) !important;
      }

      /* Make button bigger, circular, black with white icon */
      elevenlabs-convai::part(button) {
        width: 70px !important;
        height: 70px !important;
        border-radius: 50% !important;
        background: #000000 !important;
        color: #ffffff !important;
        border: 2px solid #ffffff !important;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4) !important;
        padding: 0 !important;
      }

      /* Style the chat window with dark transparent background */
      elevenlabs-convai::part(window) {
        background: rgba(0, 0, 0, 0.9) !important;
        backdrop-filter: blur(15px) !important;
        border: 1px solid rgba(0, 220, 255, 0.3) !important;
      }

      /* Make widget container background fully transparent */
      elevenlabs-convai::part(container) {
        background: transparent !important;
