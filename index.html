<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/gb-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GB Automation - 90-Day Agentic Systems Program. Build smarter and faster with AI developers that code in your vibe." />
    <title>GB Automation - Agentic Systems & Vibe Coding</title>
    <style>
      /* Customize ElevenLabs widget - FIXED POSITION */
      elevenlabs-convai {
        position: fixed !important;
        bottom: 30px !important;
        right: 30px !important;
        transform: none !important;
        z-index: 9999 !important;
        --el-avatar-size: 80px !important;
        --el-primary-color: #00DCFF !important;
        --el-background-color: transparent !important;
        --el-text-color: #ffffff !important;
      }

      /* Orb styling with glow */
      elevenlabs-convai::part(avatar) {
        width: 80px !important;
        height: 80px !important;
        box-shadow: 0 0 30px rgba(0, 220, 255, 0.6) !important;
      }

      /* Button styling - circular, black with white icon */
      elevenlabs-convai::part(button) {
        width: 60px !important;
        height: 60px !important;
        border-radius: 50% !important;
        background: #000000 !important;
        color: #ffffff !important;
        border: 2px solid #ffffff !important;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4) !important;
        padding: 0 !important;
      }

      /* Chat window styling */
      elevenlabs-convai::part(window) {
        background: rgba(0, 0, 0, 0.95) !important;
        backdrop-filter: blur(20px) !important;
        border: 1px solid rgba(0, 220, 255, 0.3) !important;
        border-radius: 20px !important;
      }

      /* Transparent container */
      elevenlabs-convai::part(container) {
        background: transparent !important;
      }

      /* Mobile responsive adjustments */
      @media (max-width: 768px) {
        elevenlabs-convai {
          bottom: 20px !important;
          right: 20px !important;
          --el-avatar-size: 60px !important;
        }

        elevenlabs-convai::part(avatar) {
          width: 60px !important;
          height: 60px !important;
        }

        elevenlabs-convai::part(button) {
          width: 50px !important;
          height: 50px !important;
        }

        /* Make chat window full width on mobile */
        elevenlabs-convai::part(window) {
          width: calc(100vw - 40px) !important;
          max-width: 400px !important;
          right: 20px !important;
          bottom: 90px !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <elevenlabs-convai agent-id="agent_7801k999ndjreah8914cn4pfy1mq"></elevenlabs-convai>

  </body>
