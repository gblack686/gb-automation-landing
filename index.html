    <style>
      /* Customize ElevenLabs widget - FIXED POSITION with cream theme */
      elevenlabs-convai {
        position: fixed !important;
        bottom: 30px !important;
        right: 30px !important;
        transform: none !important;
        z-index: 9999 !important;
        --el-avatar-size: 80px !important;
        --el-primary-color: #D97757 !important;
        --el-background-color: transparent !important;
        --el-text-color: #191919 !important;
      }

      /* Orb styling with terracotta glow */
      elevenlabs-convai::part(avatar) {
        width: 80px !important;
        height: 80px !important;
        box-shadow: 0 0 30px rgba(217, 119, 87, 0.4) !important;
      }

      /* Button styling - circular with terracotta accent */
      elevenlabs-convai::part(button) {
        width: 60px !important;
        height: 60px !important;
        border-radius: 50% !important;
        background: #191919 !important;
        color: #F3F1E7 !important;
        border: 2px solid #D6D4C8 !important;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2) !important;
        padding: 0 !important;
      }

      /* Chat window styling - cream theme */
      elevenlabs-convai::part(window) {
        background: rgba(243, 241, 231, 0.98) !important;
        backdrop-filter: blur(20px) !important;
        border: 1px solid rgba(214, 212, 200, 0.6) !important;
        border-radius: 20px !important;
        color: #191919 !important;
      }

      /* Transparent container */
      elevenlabs-convai::part(container) {
        background: transparent !important;
      }

      /* Mobile responsive adjustments */
      @media (max-width: 768px) {
        elevenlabs-convai {
          bottom: 20px !important;
          right: 20px !important;
          --el-avatar-size: 60px !important;
        }

        elevenlabs-convai::part(avatar) {
          width: 60px !important;
          height: 60px !important;
        }

        elevenlabs-convai::part(button) {
          width: 50px !important;
          height: 50px !important;
        }

        /* Make chat window full width on mobile */
        elevenlabs-convai::part(window) {
          width: calc(100vw - 40px) !important;
          max-width: 400px !important;
          right: 20px !important;
          bottom: 90px !important;
        }
      }
    </style>
  </head>
